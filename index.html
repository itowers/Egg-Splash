:root{--bg:#6a96aa;--ink:#1b1b1f;--btn:#ebe6dc;--btnsh:#8a6670}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:6px solid var(--ink);
  box-shadow:6px 6px 0 rgba(0,0,0,.16);background:#9fd3e0}
/* HUD fora da tela do jogo: faixa propria logo acima, com a mesma largura */
#hud{border:0;box-shadow:none;background:none;margin-bottom:6px}
#controls{height:calc(34px + 84px*var(--bs,1));flex:none;align-self:center;max-width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 22px 8px}
.dpad{display:flex;gap:14px}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:none;outline:none}
button svg{display:block;width:100%;height:100%;pointer-events:none}
/* botoes 8-bit que afundam: a base (contorno) fica parada e a tampa desce para dentro dela */
.arrow{width:calc(60px*var(--bs,1));height:calc(84px*var(--bs,1))}
#br svg{transform:scaleX(-1)}
.mouth{width:calc(84px*var(--bs,1));height:calc(84px*var(--bs,1))}
/* botao do rugido: SVG 8-bit da mesma familia das setas e da boca (desenhado em JS, ver ROAR_SVG), sem texto.
   Enche de amarelo de baixo para cima; cheio, fica vermelho e pisca */
#broar{width:calc(81px*var(--bs,1));height:calc(84px*var(--bs,1))}
#broar.ready .face{animation:roarpulse .5s steps(1) infinite}
@keyframes roarpulse{50%{fill:#ff6b57}}
@media (max-width:390px){#controls{padding:0 12px 8px}.dpad{gap:8px}} /* SE/mini: com botoes 1,15x a fileira nao cabia */
@media (max-width:340px){#broar{width:63px;height:66px}}
#controls .dn{display:none}
#controls button.on .up{display:none}
#controls button.on .dn{display:inline}
/* barra do topo: ocupa uma faixa propria, entao os botoes nunca cobrem a tela do jogo */
#top{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 14px 0}
#top .right{display:flex;gap:12px}
#pause{width:36px;height:40px}
#snd{width:40px;height:40px}
#spd{width:48px;height:40px}
/* piramide de ovos (fim de jogo) */
#pyr{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(27,27,31,.9);padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#pyr[hidden]{display:none}
#pyr img{display:block;max-width:100%;max-height:calc(100% - 90px);min-height:0;image-rendering:pixelated;image-rendering:crisp-edges;
  border:6px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.3);-webkit-touch-callout:default}
#pyr .row{display:flex;gap:14px}
#pyr button{font:16px/1 Silkscreen,ui-monospace,Menlo,monospace;color:var(--ink);background:var(--btn);
  border:4px solid var(--ink);box-shadow:inset 0 -4px 0 var(--btnsh);padding:12px 18px 14px}
#pyr button:active{box-shadow:none;transform:translateY(3px)}
#pyr #pyrsave{background:#f4c430;box-shadow:inset 0 -4px 0 #b0821a}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  #top{position:absolute;z-index:5;left:0;right:0;pointer-events:none;
    top:calc(env(safe-area-inset-top) + 8px);
    padding:0 calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px)}
  #top button{pointer-events:auto}
  #controls{position:absolute;left:0;right:0;height:auto;pointer-events:none;
    bottom:calc(env(safe-area-inset-bottom) + 24px);
    padding:0 calc(env(safe-area-inset-right) + 30px) 0 calc(env(safe-area-inset-left) + 30px)}
  #controls button{pointer-events:auto}
  #broar{position:absolute;right:calc(env(safe-area-inset-right) + 31px);bottom:calc(96px*var(--bs,1))} /* em cima do botao da boca, fora da tela do jogo */
}
/* menu AJUSTES (modo de teste) */
#tune{position:fixed;inset:0;z-index:30;display:flex;align-items:stretch;justify-content:center;background:rgba(27,27,31,.9);
  padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px)}
#tune[hidden]{display:none}
#tune .box{width:100%;max-width:440px;display:flex;flex-direction:column;background:var(--btn);border:4px solid var(--ink);
  box-shadow:6px 6px 0 rgba(0,0,0,.3);font:11px/1.3 Silkscreen,ui-monospace,Menlo,monospace;color:var(--ink);min-height:0}
#tune .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:4px solid var(--ink);font-size:16px}
#tunebody{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 10px 14px;flex:1;min-height:0}
#tune button{font:11px/1 Silkscreen,ui-monospace,Menlo,monospace;color:var(--ink);background:#fff8ea;border:3px solid var(--ink);
  box-shadow:inset 0 -3px 0 var(--btnsh);padding:7px 9px 9px;touch-action:manipulation}
#tune button.sel{background:#f4c430;box-shadow:inset 0 -3px 0 #b0821a}
#tune button:active{box-shadow:none;transform:translateY(2px)}
#tune h3{font-size:12px;margin:14px 0 4px;padding-top:6px;border-top:2px dashed var(--btnsh)}
#tune .note{background:#1b1b1f;color:#f4c430;padding:6px 8px;margin:8px 0 0}
#tune .row{margin:7px 0}
#tune .lab{display:flex;justify-content:space-between;gap:8px}
#tune .lab b{font-weight:normal;color:#b0521f}
#tune .lab b.ch{color:#e8402f}
#tune .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
#tune input[type=range]{width:100%;margin:4px 0 0;accent-color:#e8792b;touch-action:pan-x;height:26px}
#tune table{width:100%;border-collapse:collapse;font-size:10px;margin-top:4px}
#tune td,#tune th{border-bottom:1px solid var(--btnsh);padding:4px 2px;text-align:right;font-weight:normal}
#tune td:first-child,#tune th:first-child{text-align:left;max-width:150px;word-break:break-word}
#tune .muted{color:#8a6670}
#tunebtn{width:48px;height:40px}
#tunebtn[hidden]{display:none}
#spd[hidden]{display:none}
/* 1a partida: o botao da boca pula ate a raposa comer o primeiro ovo (aviso SEGURE A BOCA!) */
#bm.hint:not(.on){animation:bmhint .5s steps(1) infinite}
@keyframes bmhint{50%{transform:translateY(-5px)}}
</style>
</head>

  const v=Math.sign(d)*Math.min(Math.abs(d),Math.max(.4,Math.abs(d)/Math.max(1,wait-6)));a.x+=v;a.f=d<0?1:0;a.walk++;}

      if(h.fy<2){h.fy=2;h.vy=Math.abs(h.vy);}if(h.fy>72){h.fy=72;h.vy=-Math.abs(h.vy);}

function textW(s,sc=1){let w=0;for(const ch of String(s).toUpperCase())w+=(SILK[ch]||[4])[0];return Math.max(0,w-2)*sc;}
// Sombra com cuidado (as letras tem so 4 px de largura):
//  - tamanho 1: sombra so para baixo, para nao entupir o espaco entre as letras;
//  - tamanho 2+: sombra diagonal fina (metade de um pixel da letra), para nao comer o miolo das letras;
//  - acentos nao ganham sombra (o til com sombra vira dois riscos).
function text(s,x,y,sc=1,col=PAL.k,align='center',sh=null){
  const ctx=TX||cv.getContext('2d');
  s=String(s).toUpperCase();
  const tw=textW(s,sc);
  const sx=(align==='center'?Math.round(x-tw/2):align==='right'?x-tw:x)-sc; // -sc: a letra tem 1 px de folga a esquerda
  const draw=(ox,oy,c,shadow)=>{ctx.fillStyle=c;let px=sx;
    for(const ch of s){const g=SILK[ch];if(!g){px+=4*sc;continue;}
      if(g[3])g[3].split(',').forEach((r,j)=>{if(shadow&&g[2]+j<0)return;
        for(let i=0;i<r.length;i++)if(r[i]==='1')ctx.fillRect(px+ox+(g[1]+i)*sc,y+oy+(g[2]+j)*sc,sc,sc);});
      px+=g[0]*sc;}};
  if(sh){const o=Math.max(1,Math.floor(sc/2));draw(sc===1?0:o,o,sh,true);}
  draw(0,0,col,false);
}

 {sky:'#a6d0dc',b1:'#d8dcb8',b2:'#f2dca4',cl:'#f7f1dc',rc:'#b0b4b0',h1:'#b4cf98',h2:'#88b274',gt:'#8cc064',gr:'#5a8a48',dirt:'#8a5a3a',dot:'#6e4630'}, // 1 tarde dourada
 {sky:'#c7808c',b1:'#ee9a6c',b2:'#f8c27a',cl:'#fbd2b0',rc:'#a88488',h1:'#b0946c',h2:'#8a7650',gt:'#a59a58',gr:'#5f6438',dirt:'#764a32',dot:'#5a3826'}, // 2 por do sol
 {sky:'#4c4580',b1:'#7c5488',b2:'#c06a7c',cl:'#6c5c90',rc:'#463e66',h1:'#55606a',h2:'#3e4a50',gt:'#4e6250',gr:'#2c4034',dirt:'#55392c',dot:'#3e2a20'}, // 3 crepusculo
 {sky:'#1c2547',b1:'#232e58',b2:'#2b376a',cl:'#3b4777',rc:'#2e3658',h1:'#2e4648',h2:'#223636',gt:'#3d5e45',gr:'#1f3a2c',dirt:'#4a3428',dot:'#36251c'}, // 4 noite
 {sky:'#38407a',b1:'#5c5890',b2:'#a77aa0',cl:'#5a5a8e',rc:'#3a3c66',h1:'#46585e',h2:'#344648',gt:'#4a6a52',gr:'#2a4434',dirt:'#523a2c',dot:'#3c2a20'}, // 5 pre-amanhecer
 {sky:'#c4b0d4',b1:'#eebcc8',b2:'#f8d4bc',cl:'#fbe6ea',rc:'#b4a6b4',h1:'#9cb39a',h2:'#74967a',gt:'#86b874',gr:'#46784a',dirt:'#7e5238',dot:'#62402c'}, // 6 amanhecer
 {sky:'#acd2e0',b1:'#cfe2e6',b2:'#ece8d8',cl:'#f4f8f4',rc:'#adb7bc',h1:'#a6cfa0',h2:'#7ab27c',gt:'#7cbf6a',gr:'#4e894e',dirt:'#8a5a3c',dot:'#6e4630'}, // 7 manha
];
const CYCLE=150*60;   // volta completa do ceu: 2,5 min
const STEPS=8;        // transicoes de cor em 8 degraus (visual 8-bit)
// [fracao do ciclo, paleta]: entre duas paletas diferentes a cor troca em degraus
const SKYKEYS=[[0,0],[.28,0],[.38,1],[.44,1],[.50,2],[.54,2],[.60,3],[.66,4],[.76,4],[.80,5],[.85,6],[.89,6],[.94,7],[.98,0],[1,0]];
// [fracao do ciclo, angulo do sol]: 0 = topo, PI/2 = se pondo a direita, 3PI/2 = nascendo a esquerda
const SUNKEYS=[[0,0],[.38,1.0],[.56,1.78],[.80,2*Math.PI-1.78],[1,2*Math.PI]];
const ORBIT={cx:72,cy:145,rx:55,ry:110}; // topo em y=35, abaixo do HUD
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return c;}
function makeSky(p){const c=mk(),g=c.getContext('2d');
  g.fillStyle=p.sky;g.fillRect(0,0,W,H);
  g.fillStyle=p.b1;g.fillRect(0,110,W,30);
  g.fillStyle=p.b2;g.fillRect(0,128,W,20);
  return c;}
function makeLand(p){const c=mk(),g=c.getContext('2d');
  for(let x=0;x<W;x++){
    const h1=Math.round(18+8*Math.sin(x/13)+5*Math.sin(x/5.3+1));
    g.fillStyle=p.h1;g.fillRect(x,GROUND-h1-8,1,h1+8);
    const h2=Math.round(10+5*Math.sin(x/9+2)+3*Math.sin(x/4.1));
    g.fillStyle=p.h2;g.fillRect(x,GROUND-h2,1,h2);
  }
  g.fillStyle=p.gr;g.fillRect(0,GROUND,W,4);
  g.fillStyle=p.gt;g.fillRect(0,GROUND,W,1);
  g.fillStyle=p.dirt;g.fillRect(0,GROUND+4,W,H-GROUND-4);
  g.fillStyle=p.dot;
  for(let i=0;i<40;i++){g.fillRect((i*37)%W,GROUND+6+((i*13)%(H-GROUND-8)),2,1);}
  return c;}
// paletas intermediarias: cada degrau da transicao vira um fundo pre-renderizado (sem transparencia)
function mixCol(A,B,f){const x=parseInt(A.slice(1),16),y=parseInt(B.slice(1),16);
  return '#'+[16,8,0].map(sh=>Math.round((x>>sh&255)+((y>>sh&255)-(x>>sh&255))*f).toString(16).padStart(2,'0')).join('');}
function mixPal(A,B,f){const o={};for(const k in A)o[k]=mixCol(A[k],B[k],f);return o;}
const BG={};
function bgFor(a,b,f){const key=a===b||!f?a+'':a+'-'+b+'-'+f;
  if(!BG[key]){const p=key===a+''?TIMES[a]:mixPal(TIMES[a],TIMES[b],f);BG[key]={sky:makeSky(p),land:makeLand(p),pal:p};}
  return BG[key];}
for(let j=0;j<SKYKEYS.length-1;j++){const a=SKYKEYS[j][1],b=SKYKEYS[j+1][1];for(let k=0;k<=STEPS;k++)bgFor(a,b,k/STEPS);} // pre-renderiza tudo
function orb(r,col){const c=document.createElement('canvas');c.width=c.height=r*2+1;const g=c.getContext('2d');
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r){g.fillStyle=col;g.fillRect(x+r,y+r,1,1);}
  return c;}
const SUN=orb(9,'#fbe9a6'),SUN_LOW=orb(9,'#f8b45c');
// lua crescente (nao pode parecer uma bola redonda e clara)
const MOON=(()=>{const c=orb(6,'#c9d4ee'),g=c.getContext('2d');g.globalCompositeOperation='destination-out';
  for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++)if((x-3)*(x-3)+(y+2)*(y+2)<=30)g.fillRect(x+6,y+6,1,1);return c;})();
const STARS=[];{let z=7;const rnd=()=>(z=(z*16807)%2147483647)/2147483647;
  for(let i=0;i<28;i++)STARS.push({x:Math.floor(rnd()*W),y:Math.floor(4+rnd()*100),b:rnd()<.25,ph:Math.floor(rnd()*60)});}
let skyT=0,clouds=[],drops=[];
const q=(v,n=STEPS)=>Math.round(v*n)/n;
const ct=()=>(skyT%CYCLE)/CYCLE;
function lerpKeys(K,t){for(let j=0;j<K.length-1;j++){const [t0,a]=K[j],[t1,b]=K[j+1];if(t<=t1)return a+(b-a)*(t-t0)/(t1-t0);}return K[K.length-1][1];}
function skyMix(t){for(let j=0;j<SKYKEYS.length-1;j++){const [t0,a]=SKYKEYS[j],[t1,b]=SKYKEYS[j+1];
  if(t<=t1)return {a,b,f:a===b?0:q((t-t0)/(t1-t0))};}return {a:0,b:0,f:0};}
function nightK(t){return t<.58?0:t<.66?(t-.58)/.08:t<.76?1:t<.82?1-(t-.76)/.06:0;}
function orbitPos(th){return {x:Math.round(ORBIT.cx+ORBIT.rx*Math.sin(th)),y:Math.round(ORBIT.cy-ORBIT.ry*Math.cos(th))};}

/* clima: limpo -> nuvens aumentando -> chuva -> abrindo -> limpo ... */
const wx={phase:'clear',t:0,len:1,cloud:0,rain:0};
function wxGo(phase,secs){wx.phase=phase;wx.len=wx.t=Math.round(secs*60);}
function resetWeather(){wxGo('clear',25+Math.random()*20);wx.cloud=0;wx.rain=0;clouds=[];drops=[];wt=0;windPlan=[];}
/* vento: so na chuva. Empurra ovos e bolas para os dois lados (vira de direcao no meio da chuva).
   O roteiro e decidido no inicio da chuva, entao cada objeto ja nasce sabendo onde vai cair:
   a regra de alcance vale para o ponto de pouso real. */
const WIND_MAX=.22;      // px por passo na rajada mais forte
let wt=0,windPlan=[];    // wt = relogio do vento (so anda durante a partida)
// roteiro criado quando as nuvens comecam a chegar (antes da chuva), para nenhum objeto em queda ser pego de surpresa
function planWind(start,len){
  start=Math.max(start,windPlan.length?windPlan[windPlan.length-1][0]:0);
  windPlan=windPlan.filter(k=>k[0]>=wt-900);
  let f=start,d=Math.random()<.5?-1:1,v=0;const end=start+len;windPlan.push([f,0]);
  const ramp=(to,dur)=>{f+=dur;v=to;windPlan.push([f,v]);};
  const WM=WIND_MAX;
  ramp(d*WM*(.7+Math.random()*.3),120);                       // entra soprando para um lado
  while(f<end-200){
    ramp(v,Math.round(150+Math.random()*180));                       // segura
    d=-d;ramp(d*WM*(.6+Math.random()*.4),Math.round(120+Math.random()*60)); // vira para o outro lado
  }
  ramp(v,Math.max(0,end-f));ramp(0,150);                             // acalma quando a chuva para
}
function windAt(f){const P=windPlan;if(!P.length||f<=P[0][0]||f>=P[P.length-1][0])return 0;
  for(let j=1;j<P.length;j++)if(f<=P[j][0]){const [f0,a]=P[j-1],[f1,b]=P[j];return a+(b-a)*(f-f0)/(f1-f0);}return 0;}
resetWeather();
function stepWeather(){
  const k=1-wx.t/wx.len; // progresso da fase (0 -> 1)
  if(wx.phase==='clear')wx.cloud=0;
  else if(wx.phase==='build')wx.cloud=k;            // nuvens vao aumentando
  else if(wx.phase==='rain')wx.cloud=1;
  else if(wx.phase==='clearup')wx.cloud=1-k;        // ceu abrindo
  const rainTarget=wx.phase==='rain'?1:0;
  wx.rain+=Math.sign(rainTarget-wx.rain)*Math.min(Math.abs(rainTarget-wx.rain),1/90);
  if(--wx.t>0)return;
  if(wx.phase==='clear'){wxGo('build',12+Math.random()*6);wx.next=Math.round((12+Math.random()*8)*60);planWind(wt+wx.len,wx.next);}
  else if(wx.phase==='build')wxGo('rain',wx.next/60);
  else if(wx.phase==='rain')wxGo('clearup',8+Math.random()*4);
  else wxGo('clear',35+Math.random()*30);
}
function spawnCloud(){const s=wx.cloud>.55?(Math.random()<.7?2:1):wx.cloud>.25?(Math.random()<.5?1:0):0;
  clouds.push({x:Math.round(-34+Math.random()*(W+20)),y:Math.round(16+Math.random()*84),s,v:.04+Math.random()*.04,a:0,out:false});}
function updateWorld(){
  if(state==='play'){wt++;stepWeather();}
  const wind=state==='play'?windAt(wt):0;
  // nuvens: quantidade acompanha o clima, entram e saem com fade em degraus
  const want=Math.round(wx.cloud*14),alive=clouds.filter(c=>!c.out);
  if(alive.length<want&&frame%15===0)spawnCloud();
  if(alive.length>want&&frame%15===0)alive[0].out=true;
  for(const c of clouds){c.x+=c.v*(1+wx.cloud*2)+wind*1.5;if(c.x>W+4)c.x=-40;else if(c.x<-40)c.x=W+4;
    c.a=c.out?c.a-1/40:Math.min(1,c.a+1/40);}
  clouds=clouds.filter(c=>c.a>0||!c.out);
  // chuva
  const n=wx.rain*2.2;
  for(let j=0;j<Math.floor(n)+(Math.random()<n%1?1:0);j++)drops.push({x:-48+Math.random()*(W+96),y:-4-Math.random()*20});
  const dc=nightK(ct())>.5?'#8fa6c8':'#dceaf2';
  for(const d of drops){d.x+=-.3+wind*7;d.y+=4.5;
    if(d.y>=GROUND){d.dead=true;if(Math.random()<.3&&(!BARN||barnHole(Math.round(d.x),GROUND-1)))parts.push({x:d.x,y:GROUND-1,vx:(Math.random()-.5)*.6,vy:-.7,life:6,c:dc});}}
  drops=drops.filter(d=>!d.dead&&d.x>-52&&d.x<W+52);
}
function drawCloud(x,y,s){
  if(s===0){ctx.fillRect(x,y,16,3);ctx.fillRect(x+3,y-2,8,2);}
  else if(s===1){ctx.fillRect(x,y,22,4);ctx.fillRect(x+4,y-3,12,3);ctx.fillRect(x+9,y-5,6,2);}
  else{ctx.fillRect(x,y,34,5);ctx.fillRect(x+5,y-4,16,4);ctx.fillRect(x+12,y-7,10,3);ctx.fillRect(x+22,y-3,8,3);}
}
function drawOutdoor(){
  const t=ct(),m=skyMix(t),bgx=bgFor(m.a,m.b,m.f),pal=bgx.pal;
  const cov=q(clamp((wx.cloud-.35)/.65,0,1)); // ceu so fecha depois que as nuvens ja chegaram
  ctx.drawImage(bgx.sky,0,0);
  // estrelas (somem com as nuvens)
  const n=q(nightK(t)*(1-cov));
  if(n>0){ctx.globalAlpha=n;ctx.fillStyle='#f4f1e0';
    for(const s of STARS){if(s.b&&Math.floor((frame+s.ph)/30)%4===0)continue;ctx.fillRect(s.x,s.y,1,1);}
    ctx.globalAlpha=1;}
  const th=lerpKeys(SUNKEYS,t),dim=q(1-cov*.85);
  // sol: amarelo no alto, laranja perto do horizonte
  {const p=orbitPos(th);if(p.y<160){ctx.globalAlpha=dim;ctx.drawImage(Math.cos(th)>.45?SUN:SUN_LOW,p.x-9,p.y-9);ctx.globalAlpha=1;}}
  // lua: lado oposto da orbita, so a noite
  {const nk=q(nightK(t)),p=orbitPos(th+Math.PI);if(nk>0&&p.y<160){ctx.globalAlpha=Math.min(nk,dim);ctx.drawImage(MOON,p.x-6,p.y-6);ctx.globalAlpha=1;}}
  // nuvens
  ctx.fillStyle=wx.cloud>.65?pal.rc:pal.cl;
  for(const c of clouds){const a=q(c.a,4);if(!a)continue;ctx.globalAlpha=a;drawCloud(Math.round(c.x),c.y,c.s);}
  ctx.globalAlpha=1;
  ctx.drawImage(bgx.land,0,0);
  // ceu fechado escurece a paisagem (nao os itens)
  if(cov>0){ctx.fillStyle='rgba(58,66,84,'+(cov*.4)+')';ctx.fillRect(0,0,W,GROUND+4);}
}
function drawDropsOutdoor(){
  if(!drops.length)return;
  ctx.fillStyle=nightK(ct())>.5?'rgba(143,166,200,.8)':'rgba(220,234,242,.75)';
  const sl=(state==='play'?windAt(wt):0)>.05?1:-1;
  for(const d of drops){const x=Math.round(d.x),y=Math.round(d.y);ctx.fillRect(x,y,1,2);ctx.fillRect(x+sl,y+2,1,2);}
}


/* ---------- celeiro: fachada vermelha com o palheiro em cima e um vao em arco ----------
   As galinhas e o fazendeiro ficam no palheiro (a tabua do poleiro vira a beira do piso dele).
   Pelo vao se ve o lado de fora de sempre: ceu, sol/lua, nuvens, chuva e colinas.
   A fachada escurece de noite e com o ceu fechado; as duas luminarias acendem de noite.
   ?celeiro=0 volta ao campo aberto (sem fachada). */
const BARN=!/[?&]celeiro=0/.test(location.search);
const BARN_LAMPS=[17,127]; // x das duas luminarias (a cupula fica em y 46-49, a lampada em y 50)
const inArch=(x,y,k=0)=>{if(x<8-k||x>=136+k||y<46-k)return false;const dx=(x+.5-72)/(64+k),dy=(y+.5-74)/(28+k);return y>=74||dx*dx+dy*dy<=1;};
const barnHole=(x,y)=>y>=GROUND||inArch(x,y); // vao + chao: o chao fica na frente da fachada, de ponta a ponta
const BARN_IMG=(()=>{const c=mk(),g=c.getContext('2d'),R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  const RED='#8a3a30',SEAM='#7a3229',DARK='#6e2d25',TRIM='#efe6d2';
  R(0,0,W,6,'#3d383b');for(let x=0;x<W;x+=8)R(x,4,6,1,'#4a4448');R(0,6,W,2,TRIM);          // telhado e beiral
  R(0,8,W,6,RED);for(let x=0;x<W;x+=6)R(x,8,1,6,SEAM);                                       // parede de cima
  R(0,14,W,LEDGE_Y-14,'#2a1f19');                                                             // palheiro (escuro)
  for(let x=0;x<W;x++){const h=Math.round(5+2*Math.sin(x*.12)+Math.sin(x*.7));R(x,LEDGE_Y-h,1,h,'#6e5a2c');if(x%5===2)R(x,LEDGE_Y-h,1,1,'#8a7236');}
  for(const px of [0,46,94,140]){R(px,14,4,LEDGE_Y-14,RED);R(px,14,1,LEDGE_Y-14,TRIM);}     // montantes dos vaos
  R(68,0,8,9,'#4a3224');R(71,9,2,2,'#2c2c30');R(72,11,1,3,'#b89a62');                        // roldana
  R(0,37,W,H-37,RED);for(let x=0;x<W;x+=6)R(x,39,1,H-39,SEAM);R(0,37,W,2,DARK);              // parede de baixo
  for(let y=40;y<H;y++)for(let x=0;x<W;x++)if(inArch(x,y,2)&&!inArch(x,y))R(x,y,1,1,TRIM);   // friso do arco
  R(68,41,8,6,TRIM);R(69,47,6,1,TRIM);                                                        // pedra de fecho
  BARN_LAMPS.forEach((x,i)=>{const bx=i?x+7:x-8;                                              // luminarias de celeiro
    R(bx,42,2,5,'#2c2c30');R(Math.min(bx,x),43,Math.abs(x-bx)+1,1,'#2c2c30');R(x,44,1,2,'#2c2c30');
    R(x-1,46,3,1,'#2c2c30');R(x-2,47,5,1,'#2c2c30');R(x-3,48,7,1,'#3a3a3e');R(x-4,49,9,1,'#55555a');R(x-1,50,3,1,'#c8bfa8');});
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(barnHole(x,y))g.clearRect(x,y,1,1);            // abre o vao e o chao
  return c;})();
const BARN_CLIP=(()=>{const p=new Path2D();for(let y=0;y<H;y++){let x0=-1;
  for(let x=0;x<=W;x++){const h=x<W&&barnHole(x,y);if(h&&x0<0)x0=x;if(!h&&x0>=0){p.rect(x0,y,x-x0,1);x0=-1;}}}return p;})();
const BARN_DARK={};
function barnDark(lvl){ // fachada escurecida em degraus (noite / ceu fechado), so onde tem parede
  if(!BARN_DARK[lvl]){const c=mk(),g=c.getContext('2d');g.drawImage(BARN_IMG,0,0);
    g.globalCompositeOperation='source-atop';g.fillStyle='rgba(16,20,44,'+(lvl/8*.62)+')';g.fillRect(0,0,W,H);BARN_DARK[lvl]=c;}
  return BARN_DARK[lvl];}
const LAMP_GLOW=[orb(19,'#f6c25e'),orb(10,'#fbd57a')];
function drawBarn(){
  const t=ct(),nk=nightK(t),cov=q(clamp((wx.cloud-.35)/.65,0,1));
  ctx.save();ctx.clip(BARN_CLIP);drawOutdoor();ctx.restore();
  ctx.drawImage(barnDark(Math.round(clamp(nk*.85+cov*.3+(t>.44&&t<.6?.15:0),0,1)*8)),0,0);
  const lk=q(nk,4);if(lk<=0)return;
  for(const x of BARN_LAMPS){
    ctx.globalAlpha=lk*.07;ctx.drawImage(LAMP_GLOW[0],x-19,36);ctx.globalAlpha=lk*.18;ctx.drawImage(LAMP_GLOW[1],x-10,42);ctx.globalAlpha=1;
    if(lk>.5){ctx.fillStyle='#ffe9a0';ctx.fillRect(x-1,50,3,1);ctx.fillStyle='#ffffff';ctx.fillRect(x,50,1,1);
      for(let k=0;k<14;k++){ctx.fillStyle='rgba(255,226,140,'+(.22-k*.012)+')';ctx.fillRect(x-4-Math.floor(k/2),51+k,9+2*Math.floor(k/2),1);}}}
}
function drawWorld(){if(BARN)drawBarn();else drawOutdoor();}
function drawDrops(){if(!BARN)return drawDropsOutdoor();ctx.save();ctx.clip(BARN_CLIP);drawDropsOutdoor();ctx.restore();} // a chuva so aparece no vao


/* ---------- audio ---------- */
let ac=null,master=null,noiseBuf=null,silentEl=null,muted=false;
try{muted=localStorage.getItem('eggsplash-mute')==='1'}catch(e){}
function silentWav(){const n=4410,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));}
/* Som do jogo ligado: sessao "playback" (toca mesmo com a chave de silencioso, escolha anterior).
   Som DESLIGADO: sessao "ambient", AudioContext suspenso e nenhum audio tocando, entao a musica de outro app
   (Spotify, Apple Music) continua tocando enquanto a pessoa joga. */
function audioMode(){try{if(navigator.audioSession)navigator.audioSession.type=muted?'ambient':'playback'}catch(e){}}
function unlockAudio(){
  audioMode();
  if(muted){if(silentEl&&!silentEl.paused)silentEl.pause();if(ac&&ac.state==='running')ac.suspend().catch(()=>{});return;}
  if(!ac){try{
    ac=new(window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=muted?0:.9;
    const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
    const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }catch(e){ac=null;return;}}
  if(ac.state!=='running')ac.resume().catch(()=>{});

function fallFrames(vmax,target){let y=Y0,vy=Math.min(.5,vmax),n=0;while(y<target&&n<900){vy=Math.min(vy+.025,vmax);y+=vy;n++;}return n;}
// onde um objeto que nasce agora em x0 vai estar quando chegar a altura target (mesma conta do update)
function landX(x0,vmax,target,w,off=0){let y=Y0,vy=Math.min(.5,vmax),x=x0,n=0; // off = frames ate ser solto
  while(y<target&&n<900){vy=Math.min(vy+.025,vmax);y+=vy;x=clamp(x+windAt(wt+off+n),0,W-w);n++;}return x;}
// x de nascimento para cair em land; null se precisaria nascer fora da tela
function spawnXFor(land,vmax,target,w,off=0){
  if(!windPlan.length)return land;
  let x0=land;for(let k=0;k<3;k++)x0+=land-landX(x0,vmax,target,w,off);
  return x0>=2&&x0<=W-w-2&&Math.abs(landX(x0,vmax,target,w,off)-land)<1?x0:null;}
// every drop is placed so it is always possible: eggs reachable from the previous egg, balls never on top of an egg
// returns frames until the next spawn attempt
function spawn(){
  const L=level();
  const falling=items.filter(i=>!i.rain&&i.type!=='heart'&&i.state==='fall').length;
  if(falling>=Math.min(L.maxOn,hens.length))return 6; // mais galinhas (nivel) = mais objetos ao mesmo tempo
  // o 1o objeto e ovo e o 2o ja e a primeira bola do fazendeiro (apresentada sozinha e mais devagar).
  // Quem nunca comeu um ovo: o fazendeiro espera o 1o ovo comido (no maximo 3 ovos), uma novidade por vez.
  const holdBall=lastBallPhase<0&&!mouthKnown&&eggRun<3;
  const phaseIntro=spawned>=1&&lastBallPhase<0&&!holdBall;       // so a 1a bola da partida e apresentada (DESVIE!)
  const ballP=BOLA()?Math.max(BOLA_P0,L.ballP):L.ballP; // BOLA (v8): ameaca desde o comeco (piso de BOLA_P0); o chao sujo nao soma mais bolas
  let type=phaseIntro?BAD:spawned<3||holdBall?'egg':Math.random()<ballP?BAD:'egg';
  if(type===BAD&&ballRun>=3)type='egg';                          // no maximo 3 ruins seguidos
  if(type==='egg'&&spawned>=3&&curveS()>=20&&eggRun>=6)type=BAD;    // depois de 20, no maximo 6 ovos seguidos
  if(type==='egg'&&spawned>=2&&!holdBall&&ballGap>=BALL_GAP())type='ball'; // o fazendeiro nao para de jogar
  if(type===BAD&&farmerRest>0)type='egg'; // BOLA: depois de acertar, o fazendeiro descansa um pouco
  if(type==='egg'&&!CONST()&&spawned>=3&&(rotSeen?Math.random()<rotP(score):score>=ROT_FROM&&newOK()))type='rotten'; // ovo podre extra; o primeiro e garantido ao chegar em ROT_FROM
  const intro=(phaseIntro&&type===BAD)||(type==='rotten'&&!rotSeen); // apresentacao:
  if(intro&&falling>0)return 6;                                  // cai sozinha...
  const fall=intro?Math.round(L.fall*1.3):L.fall,vmax=intro?vmaxFor(fall):L.vmax; // ...e 30% mais devagar
  // quem solta: bola = o fazendeiro (um arremesso por vez); ovo e ovo podre = a galinha livre mais perto
  // toda bola e jogada pelo fazendeiro (uma por vez)
  const thrown=type==='ball';
  if(thrown&&items.some(i=>i.wait>0&&i.thrown))return 6;
  const LEAD=thrown?leadBall():LEAD_EGG+Math.ceil(W/(2*Math.max(2,hens.length))/1.6); // frames ate o objeto ser solto (a galinha/o fazendeiro vai ate la)
  const arr=frame+LEAD+fallFrames(vmax,type!=='ball'?GROUND-26:GROUND-23);
  recent=recent.filter(r=>r.arr>frame-20);
  // x = onde vai CAIR (as regras valem para o pouso); sx = onde nasce, ja descontando o vento
  const tgt=type!=='ball'?GROUND-26:GROUND-23,wd=type!=='ball'?8:9;
  let x=0,sx=0,ok=false;
  // o fazendeiro mira onde a raposa esta AGORA (quando pega a bola); a mira melhora com a pontuacao
  const aim=type==='ball'&&Math.random()<aimP(curveS())?fox.x+8-4.5+(Math.random()*2-1)*aimErr(curveS()):null;
  for(let i=0;i<24&&!ok;i++){
    if(type==='egg'){
      const reach=Math.max(8,1.2*reachK()*(arr-lastEgg.arr)); // reachK: alcance acompanha a velocidade da raposa (ajustes)
      // sorteia dentro da faixa alcancavel (antes cortava nas bordas: no comeco ~45% dos ovos caiam colados na parede
      // e a galinha so ia de um canto ao outro)
      const lo=Math.max(4,lastEgg.x-reach),hi=Math.min(W-12,lastEgg.x+reach);
      x=lo+Math.random()*(hi-lo);
      ok=!recent.some(r=>r.type!=='egg'&&Math.abs(r.arr-arr)<32&&Math.abs(r.x-x)<20);
    }else{
      if(aim!==null)x=clamp(aim+(i?(i%2?1:-1)*Math.ceil(i/2)*5:0),4,W-13); // mirando: se cair num ovo, desvia aos poucos
      else x=4+Math.random()*(W-(type==='ball'?17:16)); // bola e ovo podre: nunca em cima de um ovo
      ok=!recent.some(r=>r.type==='egg'&&Math.abs(r.arr-arr)<32&&Math.abs(r.x-x)<22);
    }
    if(ok){sx=spawnXFor(x,vmax,tgt,wd,LEAD);ok=sx!==null;}
  }
  if(!ok)return L.interval;
  let hen=-1;
  if(!thrown){const busy=new Set(items.filter(i=>i.wait>0&&i.hen>=0).map(i=>i.hen));let bd=1e9;
    hens.forEach((h,i)=>{const d=Math.abs(h.x-(sx-2));if(!busy.has(i)&&d<bd){bd=d;hen=i;}});
    if(hen<0)return 6;}
  if(type==='egg'){lastEgg={x,arr};eggRun++;ballRun=0;}
  else if(type===BAD){ballRun++;eggRun=0;lastBallPhase=L.phase;}
  else{if(!rotSeen)markNew();rotSeen=true;} // ovo podre extra
  if(intro&&type===BAD)markNew(); // 1a bola da partida
  spawned++;if(thrown)ballGap=0;
  recent.push({type,x,arr});
  const gold=type==='egg'&&!CONST()&&score>=GOLD_FROM&&fox.big===0&&!items.some(i=>i.gold)&&(goldSeen||newOK())&&Math.random()<GOLD_P;
  if(gold&&!goldSeen){goldSeen=true;markNew();}
  const perchHatch=!CONST()&&hens.length<henTarget(score); // falta galinha no poleiro: choca ja (a galinha vai para o poleiro quando a raposa encosta nela)
  const hatch=!gold&&type==='egg'&&!bird&&hatchCD===0&&!items.some(i=>i.hatch)&&(henSeen||newOK())&&perchHatch; // so nasce pintinho quando o nivel sobe
  if(hatch&&!henSeen)markNew(); // 1o pintinho/galinha da partida
  items.push({type,x:sx,y:Y0,vx:0,vy:Math.min(.5,vmax),state:'fall',t:0,vmax,ph:L.phase,intro,hatch,gold,land:x,wait:LEAD,hen,thrown,perch:hatch&&perchHatch});
  if(thrown&&BOLA()&&dirt>=3&&!intro&&Math.random()<PAIR_P){ // FURIOSO: a 2a bola cai ao lado (24-36 px), sempre com um vao para a raposa
    for(let k=0;k<8;k++){const x2=x+(Math.random()<.5?-1:1)*(24+Math.random()*12);
      if(x2<4||x2>W-13||recent.some(r=>r.type==='egg'&&Math.abs(r.arr-arr)<32&&Math.abs(r.x-x2)<22))continue;
      const sx2=spawnXFor(x2,vmax,tgt,wd,LEAD);if(sx2===null)continue;
      items.push({type,x:sx2,y:Y0,vx:0,vy:Math.min(.5,vmax),state:'fall',t:0,vmax,ph:L.phase,land:x2,wait:LEAD,hen:-1,thrown:false,pair:true});
      recent.push({type,x:x2,arr});break;}}
  return intro?L.interval+Math.round(fall*.6):L.interval;
}
// rugido: cada ovo colorido cai de uma galinha voando doida pela tela
function spawnRain(){const h=hens[Math.floor(Math.random()*hens.length)];
  items.push({type:'egg',x:clamp(Math.round(h.x)+2+Math.round((Math.random()-.5)*4),2,W-10),y:h.fy!=null?Math.round(h.fy)+8:Y0,vx:0,vy:.5+Math.random()*.8,state:'fall',t:0,rain:true,col:Math.floor(Math.random()*EGG_COLS.length)});}
// lost hearts come back during the rain, dropped on the side farthest from the fox
function spawnHeart(bx){items.push({type:'heart',x:bx,bx,y:-10,vx:0,vy:0,state:'fall',t:0});}
// lost hearts come back during the rain, spread over the whole rain and across the whole screen (shuffled lanes)
function planHearts(n){
  const lanes=[...Array(n)].map((_,i)=>Math.round(8+(n>1?i*(W-25)/(n-1):(W-25)/2)));
  for(let i=lanes.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[lanes[i],lanes[j]]=[lanes[j],lanes[i]];}
  const span=RAIN_LEN-100;
  return lanes.map((x,i)=>({k:30+Math.round((i+.5)*span/n),x}));
}
function startRain(){
  rainT=RAIN_LEN;rainRun=0;heartsToDrop=MAXL()-lives;heartPlan=planHearts(heartsToDrop);sfx.rain();
  for(const it of items)if(it.type==='ball'||it.type==='rotten'){it.dead=true;burst(it.x+4,it.y+4,8,[PAL.t,PAL.y],1.2,1.2);}
    else if(it.wait>0)it.wait=0; // a galinha levou um susto e soltou o ovo que ia botar
  items=items.filter(i=>!i.dead);
  for(const h of hens){h.home=h.x;h.fy=LEDGE_Y-12;h.vx=(Math.random()-.5)*3;h.vy=-1-Math.random();} // todas levantam voo
  farmer.run=farmer.x<W/2?1:-1;
}
// rugido: so com o botao cheio e fora da chuva. Assusta a galinha que bloqueia e comeca a Chuva de Ovos.
function doRoar(){
  if(CONST()||state!=='play'||rainT>0||roarP()<1)return;
  roars.push({s:score,w:roarFull,busy:fox.stun>0||fox.sick>0||fox.halt>0});
  roarEggs=0;roarT=0;roarFull=0;roarHint=0;
  fox.roar=ROAR_ANIM;quake=QUAKE_T;sfx.roar();
  if(bird&&bird.kind==='hen'){sfx.cluck();henFly(0);} // a galinha que bloqueava foge para o poleiro
  else if(bird&&bird.kind==='chick'&&bird.ground){const d=bird.x+4<fox.x+8?-1:1;bird.ground=false;bird.vy=-2.7;bird.vx=d*1.7;bird.face=d;bird.scared=bird.t;sfx.chirp();}
  startRain();
}
function burst(x,y,n,colors,spd=1.5,up=1.5){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*spd*2,vy:-Math.random()*up-.3,
  life:25+Math.random()*20,c:colors[i%colors.length]});}
function gameOver(){state='over';quake=0;overT=0;saveGame();if(pts>best){best=pts;newBest=true;try{localStorage.setItem(bestKey(),best)}catch(e){}}sfx.over();if(newBest)sfx.record();}

function breakEgg(it){
  it.dead=true;const cx=it.x+4;
  if(it.gold){burst(cx,GROUND-2,10,[PAL.y,'#b8861a','#fff3b0'],1.3,1.6);sfx.heartLost();return;} // perder o dourado nao tira vida
  if(it.rain||rainT>0){const c=it.rain?EGG_COLS[it.col]:[PAL.w,PAL.c];burst(cx,GROUND-2,5,[c[0],c[1]],1.2,1.4);burst(cx,GROUND-2,3,[PAL.y],.8,1);sfx.splat();
    puddles.push({x:Math.round(cx-11),w:22,life:Infinity,rain:true,col:it.rain?it.col:null});return;}
  if(BOLA()){ // modo BOLA: nao tira vida, suja o chao (escorrega mais e vem mais bola)
    dirt=Math.min(DIRT_MAX,dirt+1);dirtT=0;missed++;calm=0;if(!it.hatch)starve();logLoss('egg');combo=0;shake=3;sfx.crack();sfx.slip();
    revengeBall();
    if(!dirtSeen){dirtSeen=true;bolaHint('DEIXOU CAIR?','O FAZENDEIRO VAI TE ACERTAR!');}
    else if(dirt>=3&&!furySeen){furySeen=true;bolaHint('FAZENDEIRO FURIOSO!','COMA 5 OVOS PARA ACALMAR');}
    puddles.push({x:Math.round(cx-11),w:22,life:Infinity});
    burst(cx,GROUND-2,6,[PAL.w,PAL.c],1.4,1.8);burst(cx,GROUND-2,5,[PAL.y],1,1.2);return;}
  lives--;losses.push('egg');logLoss('egg');combo=0;shake=5;sfx.crack();if(lives>0)sfx.hurt();
  puddles.push({x:Math.round(cx-11),w:22,life:Infinity}); // puddles stay until the next egg rain ends
  burst(cx,GROUND-2,6,[PAL.w,PAL.c],1.4,1.8);burst(cx,GROUND-2,5,[PAL.y],1,1.2);
  if(lives<=0)gameOver();
}

// modo BOLA: CALM_N ovos seguidos (fora da chuva) tiram uma gota / um nivel de bravo
function calmEgg(){if(!BOLA()||dirt===0||rainT>0)return;if(++calm>=CALM_N){calm=0;dirt--;bolaHint('CALMOU!',dirt?'':'CHÃO LIMPO',70);tone(880,0,.08,'square',.05);tone(1175,.08,.1,'square',.05);}}
// modo BOLA: a bola que acerta (pancada ou engolida) tira uma vida
function ballLife(it){if(!BOLA())return;farmerRest=REST_T;if(it&&it.revenge)revHit++;lives--;losses.push('ball');logLoss('ball');shake=9;if(lives>0)sfx.hurt();if(lives<=0)gameOver();}

/* ---------- ovo podre ---------- */
// cai no chao: nao tira vida; deixa um splash verde que fica ate a Chuva de Ovos
function breakRotten(it){
  it.dead=true;const cx=it.x+4;sfx.rotten();
  burst(cx,GROUND-2,7,['#a3ad5e','#6f7a34','#5c4426'],1.3,1.6);
  puddles.push({x:Math.round(cx-11),w:22,life:Infinity,rot:true}); // splash verde: deixa a raposa lenta (nao escorrega), fica ate a Chuva de Ovos
}
// comeu: vomita e fica parado um instante (sem perder vida, mas zera o combo e nao conta ponto)
function eatRotten(it){
  it.dead=true;combo=0;feed(1);fox.sick=FOME_ON()?SICK_BOLA:Math.round(T.sick*60); // BOLA: mata a fome, mas enjoa 1 s
  fox.vx=0;fox.chew=0;shake=3;sfx.vomit();
}

/* ---------- ovo dourado ---------- */
function eatGold(it){
  it.dead=true;ateEgg();score+=GOLD_PTS;combo++;gain(GOLD_PTS);roarAdd(GOLD_PTS);startEat(GOLD);fox.fat=FAT_T;eaten.push(-2);
  feed(99);fox.big=BIG_T;fox.stun=0;fox.sick=0;fox.halt=0;fox.inv=0;sfx.power();
  burst(fox.x+8,GROUND-16,16,[PAL.y,'#fff3b0',PAL.t],1.8,2.2);
  if(bird&&bird.kind==='hen')henFly(0);
}
const bigK=()=>{const b=fox.big;if(!b)return 1; // escala para desenhar: cresce piscando no inicio e pisca antes de acabar
  if(b>BIG_T-BIG_GROW)return Math.floor((BIG_T-b)/5)%2?2:1.5;
  if(b<BIG_WARN)return Math.floor(b/(b<40?4:8))%2?1:2;return 2;};
// invencivel: o que encosta na raposa gigante sai voando
function smashAway(it){
  it.state='bounce';it.t=0;it.b=1;it.vy=-2.6;it.vx=(it.x+4<fox.x+8?-1:1)*2.2;sfx.smash();
  burst(it.x+4,it.y+4,6,[PAL.y,PAL.t],1.4,1.4);
}

/* ---------- pintinho -> galinha ---------- */
// O ovo marcado choca sozinho perto do chao, com ou sem a raposa: conta como pego (+1) e sai um pintinho.
function hatchEgg(it){
  it.dead=true;score++;combo++;gain(1);hatched++;roarAdd(1);sfx.hatch();
  const cx=it.x+4,cy=it.y+5;
  burst(cx,cy,8,[PAL.w,PAL.c,PAL.t],1.2,1.4);
  bird={kind:'chick',x:clamp(cx-4,2,W-10),y:cy-4,vx:(cx<fox.x+8?-1:1)*.7,vy:-1.6,t:0,face:cx<fox.x+8?-1:1,ground:false,hopT:20,perch:!!it.perch};
}
const henBox=b=>({x:b.x+1,w:10});
function updateBird(){
  if(hatchCD>0&&!bird)hatchCD--;
  if(!bird)return;
  const b=bird;b.t++;
  if(b.kind==='chick'||b.kind==='grow'){
    // pulinhos pelo chao; atravessa a raposa sem atrapalhar
    b.vy+=.12;b.x+=b.vx;b.y+=b.vy;
    if(b.x<2){b.x=2;b.vx=Math.abs(b.vx);b.face=1;}
    if(b.x>W-10){b.x=W-10;b.vx=-Math.abs(b.vx);b.face=-1;}
    if(b.y>=GROUND-8){b.y=GROUND-8;b.vy=0;b.vx=0;b.ground=true;}
    if(b.kind==='chick'){
      // foge da raposa: se ela chega perto, pula para longe na hora; encurralado na parede, pula por cima dela
      const dx=b.x+4-(fox.x+8),near=fox.big?CHICK_FLEE+8:CHICK_FLEE;
      if(b.ground&&Math.abs(dx)<near){
        let d=dx<0?-1:1;
        const stuck=d<0?b.x<14:b.x>W-22;
        if(stuck){d=-d;b.vy=-2.7;b.vx=d*1.7;}else{b.vy=-1.5;b.vx=d*1.4;}
        b.ground=false;b.face=d;b.hopT=12;
        if(!b.scared||b.t-b.scared>40){b.scared=b.t;sfx.chirp();}
      }else if(b.ground&&--b.hopT<=0){b.ground=false;b.vy=-1.2-Math.random()*.6;
        let d=Math.random()<.5?-1:1;if(b.x<20)d=1;if(b.x>W-28)d=-1;
        b.vx=d*(.4+Math.random()*.5);b.face=d;b.hopT=25+Math.floor(Math.random()*30);}
      if(b.t%50===0)sfx.chirp();
      // vira galinha depois de um tempo, mas so longe da raposa (para nascer sem encostar nela)
      if(b.t>=(b.perch?CHICK_LIFE/2:CHICK_LIFE)&&b.ground&&Math.abs(b.x+4-(fox.x+8))>22){b.kind='grow';b.t=0;sfx.grow();}
    }else if(b.t>=GROW_T){ // vira galinha e bloqueia; so vai para o poleiro quando a raposa encosta nela
      b.kind='hen';b.t=0;b.x=clamp(b.x-2,0,W-12);b.y=GROUND-14;b.walk=0;
      {const hb=henBox(b),fl=fox.x+3;if(fl+10>hb.x&&fl<hb.x+hb.w) // nasce sem encostar na raposa
        b.x=hb.x+hb.w/2<fl+5?(fl-hb.w-2>=0?fl-hb.w-3:fl+12):(fl+12<=W-12?fl+12:fl-hb.w-3);}
      burst(b.x+6,b.y+4,12,[PAL.t,PAL.w,PAL.r],1.4,1.6);sfx.cluck();
      if(!henSeen){henSeen=true;henHint=180;markNew();} // 1a galinha que bloqueia: aviso EMPURRE!
    }
    return;
  }
  if(b.kind==='hen'){
    // anda devagar ate ficar colada do lado da raposa e fica ali, de bloqueio
    const fb={x:fox.x+3,w:10},hb=henBox(b);
    const side=hb.x+hb.w/2<fb.x+fb.w/2?-1:1; // de que lado da raposa a galinha esta
    const target=side<0?fb.x-hb.w-2:fb.x+fb.w+2;
    const dx=target-hb.x;
    if(Math.abs(dx)>.5){const v=Math.sign(dx)*Math.min(.35,Math.abs(dx));b.x=clamp(b.x+v,0,W-12);b.walk++;b.face=Math.sign(dx);}
    else b.face=-side;
    if(b.t%90===45)sfx.cluck();
    if(b.t>=HEN_LIFE)henFly(0,false); // ninguem encostou: vai embora (nao vai para o poleiro)
    return;
  }
  if(b.kind==='fly'){
    if(b.perch!=null){ // voa ate o lugar livre no poleiro e vira mais uma galinha botando
      const tx=b.perch,ty=LEDGE_Y-12,dx=tx-b.x,dy=ty-b.y;
      if(b.t>20){b.vx+=(clamp(dx*.05,-1.4,1.4)-b.vx)*.15;b.vy+=(clamp(dy*.05,-1.6,1.2)-b.vy)*.15;b.face=dx<0?-1:1;}
      else b.vy=Math.max(b.vy-.06,-2.4);
      b.x+=b.vx;b.y+=b.vy;if(b.t%8===0)sfx.flap();
      if(b.t>20&&Math.abs(dx)<1.5&&Math.abs(dy)<1.5){hens.push({x:tx,f:b.face<0?1:0,walk:0});sfx.cluck();lvl=hens.length;lvlT=100;sfx.record(); // nivel novo
        burst(tx+6,LEDGE_Y-6,8,[PAL.t,PAL.w,PAL.c],1,1);bird=null;
        hatchCD=HATCH_CD;}
      return;}
    b.vy=Math.max(b.vy-.06,-2.4);b.x+=b.vx;b.y+=b.vy;
    if(b.t%8===0)sfx.flap();
    if(b.t%5===0)parts.push({x:b.x+6,y:b.y+8,vx:(Math.random()-.5)*.6,vy:.3,life:30,c:Math.random()<.5?PAL.t:PAL.w});
    if(b.y<-20||b.x<-20||b.x>W+8){bird=null;hatchCD=HATCH_CD;}
  }
}
function henFly(dir,toPerch=true){
  const b=bird;const d=dir||(b.x+6<fox.x+8?-1:1);
  Object.assign(b,{kind:'fly',t:0,vx:d*1.1,vy:-1.4,face:d,perch:toPerch&&hens.length<HENS_MAX?perchSpot():null});
  burst(b.x+6,b.y+6,14,[PAL.t,PAL.w,PAL.c],1.6,1.8);
}
// a raposa nao atravessa a galinha: bate, para, e a galinha sai voando
function henBlock(){
  if(!bird||bird.kind!=='hen')return;
  const hb=henBox(bird),fl=fox.big?fox.x-2:fox.x+3,fr=fox.big?fox.x+18:fox.x+13;
  if(fr<=hb.x||fl>=hb.x+hb.w)return;
  if(fox.big){sfx.cluck();henFly(hb.x+hb.w/2<fox.x+8?-1:1);return;} // gigante: a galinha sai voando sem parar a raposa
  const fromLeft=fl+5<hb.x+hb.w/2;
  fox.x=fromLeft?hb.x-13:hb.x+hb.w-3;

  updateBird();

  // fox

  fox.onRot=!fox.onP&&!fox.big&&puddles.some(p=>p.rot&&cx>p.x&&cx<p.x+p.w); // ovo podre no chao: gruda e deixa a raposa lenta

    if(frame%4===0)parts.push({x:fox.x+8+(Math.random()-.5)*26,y:GROUND-4-Math.random()*28,vx:0,vy:-.5,life:18,c:Math.random()<.5?PAL.y:'#fff3b0'});}

  else{if(keys.l||touch.l)dir--;if(keys.r||touch.r)dir++;

  if(fox.onP){

  }else{
    const k=dirtK(),acc=T.acc*(1-.6*k)*(weak()?FRACA_K:1),brake=T.brake+(.94-T.brake)*k; // BOLA: chao sujo acelera menos e desliza mais
    if(dir){fox.vx+=dir*acc*(Math.sign(fox.vx)===-dir?1+k:1);fox.vx=clamp(fox.vx,-max,max);}

  if(fox.fat>0)fox.fat--;

  updateFarm();

    }
  }

const ROAR_ICON=[

/* enchendo: amarelo sobe de baixo para cima; cheio: o botao fica VERMELHO (facil de ver) e pisca */
function ROAR_SVG(p,ready,down){
  const px=(x,y,c,w=1,h=1)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
  const rr=(x,y,w,h,c,cls='')=>`<path${cls?` class="${cls}"`:''} d="M${x+2} ${y}h${w-4}v1h1v1h1v${h-4}h-1v1h-1v1h-${w-4}v-1h-1v-1h-1v-${h-4}h1v-1h1z" fill="${c}"/>`;
  const W=27,FH=22,dy=down?3:0;
  const C=ready?{face:'#e8402f',hi:'#ff9a8a',side:'#a8261b',ink:'#1b1b1f'}:{face:'#d9d3c7',hi:'#f2eee6',side:'#8f877c',ink:'#5a554d'};
  let s=`<svg viewBox="0 0 ${W} 28" shape-rendering="crispEdges">`+rr(0,0,W,28,'#1b1b1f')+rr(1,1,W-2,26,down?'#3d2f35':C.side);
  s+=`<g transform="translate(0 ${dy})">`+rr(1,1,W-2,FH,C.face,ready?'face':'');
  if(!ready&&p>0){ // enchendo: amarelo sobe em linhas inteiras de pixel, com a superficie mais clara
    const top=1+FH-Math.max(1,Math.round(p*FH));
    s+=`<clipPath id="rcl">${rr(1,1,W-2,FH,'#000')}</clipPath><g clip-path="url(#rcl)">`+
      px(1,top,'#f4c430',W-2,1+FH-top)+px(1,top,'#fff3b0',W-2,1)+'</g>';}
  s+=px(3,2,C.hi,W-6)+px(2,3,C.hi,1,FH-4); // brilho no canto de cima, como nos outros botoes
  const pal=ready?{k:C.ink,y:'#f4c430',t:'#fff3b0'}:{k:C.ink,y:'#f7f4ee',t:'#ffffff'}; // pronto: trovao amarelo no vermelho
  ROAR_ICON.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch])s+=px(6+x,3+y,pal[ch]);}));
  return s+'</g></svg>';}

/* ---------- piramide de ovos ---------- */
// Pilha "bala de canhao": camadas quadradas b*b, (b-1)*(b-1)... e cada ovo de cima fica no vao entre 4 de baixo.
// A quantidade bate exatamente com os ovos comidos: as camadas de baixo sao completas e a do topo leva o resto.
const sqp=b=>b*(b+1)*(2*b+1)/6;
function pyramidCells(n){
  if(n<=0)return [];
  let b=1;while(sqp(b)<n)b++;
  let miss=sqp(b)-n,top=1;
  while(miss>=top*top){miss-=top*top;top++;} // tira camadas inteiras do topo
  const cells=[];
  for(let s=b;s>=top;s--){const L=b-s,c=(s-1)/2;let layer=[];
    for(let i=0;i<s;i++)for(let j=0;j<s;j++)layer.push({i,j,L,d:(i-c)**2+(j-c)**2,a:Math.atan2(j-c,i-c)});
    if(s===top&&miss){layer.sort((p,q)=>p.d-q.d||p.a-q.a);layer=layer.slice(0,s*s-miss);} // topo parcial, centralizado
    for(const e of layer){const wx=e.i+L/2,wy=e.j+L/2;cells.push({L,k:wx+wy,x:Math.round((wx-wy)*6),y:Math.round((wx+wy)*3-L*7)});}
  }
  return cells.sort((p,q)=>p.L-q.L||p.k-q.k); // desenha de tras para frente, de baixo para cima
}
function drawPyramid(list,chicks){
  const n=list.length,cells=pyramidCells(n);
  // cores embaralhadas (sempre igual para a mesma partida)
  let z=n*7919+13;const rnd=()=>(z=(z*16807)%2147483647)/2147483647;
  const cols=[...list];for(let i=cols.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[cols[i],cols[j]]=[cols[j],cols[i]];}
  let minX=-8,maxX=8,minY=-15,maxY=0,fx=0,fy=0;
  if(n){const topL=cells[cells.length-1].L,tops=cells.filter(c=>c.L===topL);
    fx=Math.round(tops.reduce((a,c)=>a+c.x,0)/tops.length);fy=Math.min(...tops.map(c=>c.y))-10+2;
    minX=Math.min(...cells.map(c=>c.x))-4;maxX=Math.max(...cells.map(c=>c.x))+4;maxY=Math.max(...cells.map(c=>c.y));minY=fy-15;}
  const nc=Math.min(chicks,12),HEAD=44,FOOT=nc?44:24;
  const PW=Math.max(124,Math.ceil((maxX-minX+30)/2)*2);
  const PH=Math.max(Math.round(PW*1.25),HEAD+(maxY-minY)+FOOT+10);
  const ox=Math.round(PW/2-(minX+maxX)/2),oy=PH-FOOT-maxY;
  const c=document.createElement('canvas');c.width=PW;c.height=PH;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const P=TIMES[0],gy=n?oy+Math.min(...cells.filter(e=>e.L===0).map(e=>e.y))-3:oy-4;
  // ceu, sol e colinas
  g.fillStyle=P.sky;g.fillRect(0,0,PW,PH);
  g.fillStyle=P.b1;g.fillRect(0,gy-34,PW,34);g.fillStyle=P.b2;g.fillRect(0,gy-16,PW,16);
  g.drawImage(SUN,PW-30,Math.max(HEAD-2,Math.min(HEAD+10,gy-62)));
  for(let x=0;x<PW;x++){const h1=Math.round(18+8*Math.sin(x/13)+5*Math.sin(x/5.3+1));g.fillStyle=P.h1;g.fillRect(x,gy-h1-8,1,h1+8);
    const h2=Math.round(10+5*Math.sin(x/9+2)+3*Math.sin(x/4.1));g.fillStyle=P.h2;g.fillRect(x,gy-h2,1,h2);}
  g.fillStyle=P.gr;g.fillRect(0,gy,PW,PH-gy);g.fillStyle=P.gt;g.fillRect(0,gy,PW,1);
  g.fillStyle=P.dirt;g.fillRect(0,PH-FOOT+6,PW,FOOT);g.fillStyle=P.gr;g.fillRect(0,PH-FOOT+6,PW,1);
  g.fillStyle=P.dot;for(let i=0;i<PW/3;i++)g.fillRect((i*37)%PW,PH-FOOT+9+((i*13)%(FOOT-10)),2,1);
  // sombra da piramide
  if(n){g.fillStyle='rgba(30,60,30,.25)';for(const e of cells)if(e.L===0)g.fillRect(ox+e.x-5,oy+e.y-2,10,3);}
  // ovos
  cells.forEach((e,i)=>g.drawImage(cols[i]>=0?RAIN_EGGS[cols[i]]:cols[i]===-2?GOLD:EGG,ox+e.x-4,oy+e.y-10));
  // raposa no topo, sorrindo
  g.drawImage(FOX.s0[0],ox+fx-8,n?oy+fy-15:oy-15);
  // pintinhos (ovos que chocaram em vez de serem comidos)
  for(let i=0;i<nc;i++)g.drawImage(CHICK[i%3===1?1:0][i%2],Math.round(PW/2-(nc*11-3)/2+i*11),PH-FOOT+2);
  // textos
  TX=g;const say=(t,x,y,sc,col)=>text(t,x,y,sc,col,'center',PAL.k);
  say('A RAPOSA COMEU',PW/2,8,1,PAL.t);
  {const t=n+(n===1?' OVO':' OVOS');say(t,PW/2,18,textW(t,3)<=PW-8?3:2,PAL.y);} // numero grande nao cabe em 3x
  if(nc)say('+'+chicks+(chicks===1?' VIROU PINTINHO':' VIRARAM PINTINHO'),PW/2,PH-FOOT+14,1,PAL.t);
  say('EGG SPLASH',PW/2,PH-11,1,PAL.w);
  TX=null;
  // versao grande para exportar (pixels inteiros, ~1080 px de largura)
  const k=Math.max(1,Math.ceil(1080/PW)),out=document.createElement('canvas');out.width=PW*k;out.height=PH*k;
  const o=out.getContext('2d');o.imageSmoothingEnabled=false;o.drawImage(c,0,0,out.width,out.height);
  return out;
}

  let aw=st.width-4,ah=st.height-34; // retrato: a moldura encosta nas bordas para o jogo ficar o maior possivel // o HUD (logo acima) divide a altura com o jogo
  if(land){
    /* paisagem: o jogo fica entre as colunas de botoes. Mede onde os botoes realmente estao (setas e pausa a esquerda;
       boca, RUGIR e botoes do topo a direita) para a moldura nunca encostar neles (iPhone Duo fechado, 1,45:1, encostava) */
    const R=id=>document.getElementById(id).getBoundingClientRect();
    const l=Math.max(dp.getBoundingClientRect().right,R('pause').right)-st.left; // coordenadas relativas ao #stage (que ja desconta o notch)
    const r=st.right-Math.min(R('bm').left,R('broar').left,document.querySelector('#top .right').getBoundingClientRect().left);
    aw=st.width-2*(Math.max(l,r)+10);
  }
  const s=Math.max(1,Math.min((aw-12)/W,(ah-12)/(H+HH)));
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  hud.style.width=Math.floor(W*s)+'px';hud.style.height=Math.floor(HH*s)+'px'; // alinhado com a parte de dentro da moldura
  if(!land){
    /* retrato: a fileira de botoes acompanha a largura do jogo (com um minimo confortavel para o polegar), centrada.
       Em tela larga (iPhone Duo aberto, ~0,7:1) as setas e a boca iam para as bordas, longe do jogo, com o RUGIR solto no meio */
    const cs=getComputedStyle(ctl),need=dp.offsetWidth+document.getElementById('broar').offsetWidth+document.getElementById('bm').offsetWidth
      +parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)+24;
    ctl.style.width=Math.min(st.width,Math.max(Math.floor(W*s)+12,360,need))+'px';
  }
}

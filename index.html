<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Egg Splash">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6a96aa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Egg Splash</title>
<style>
:root{--bg:#6a96aa;--bg2:#6390a4;--ink:#1b1b1f;--btn:#ebe6dc;--btnsh:#8a6670}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
  background-image:repeating-conic-gradient(var(--bg) 0 25%,var(--bg2) 0 50%);background-size:40px 40px;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:6px solid var(--ink);
  box-shadow:10px 10px 0 rgba(0,0,0,.16);background:#9fd3e0}
#controls{height:118px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 8px}
.dpad{display:flex;gap:14px}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:none;outline:none}
button svg{display:block;width:100%;height:100%;pointer-events:none}
.arrow{width:60px;height:80px}
#br svg{transform:scaleX(-1)}
.mouth{width:88px;height:88px}
button.on svg{transform:translateY(4px)}
#br.on svg{transform:scaleX(-1) translateY(4px)}
/* barra do topo: ocupa uma faixa propria, entao os botoes nunca cobrem a tela do jogo */
#top{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 14px 0}
#top .right{display:flex;gap:12px}
#pause{width:36px;height:40px}
#snd{width:40px;height:40px}
#spd{width:48px;height:40px}
/* piramide de ovos (fim de jogo) */
#pyr{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(27,27,31,.9);padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#pyr[hidden]{display:none}
#pyr img{display:block;max-width:100%;max-height:calc(100% - 90px);min-height:0;image-rendering:pixelated;image-rendering:crisp-edges;
  border:6px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.3);-webkit-touch-callout:default}
#pyr .row{display:flex;gap:14px}
#pyr button{font:bold 16px/1 ui-monospace,Menlo,monospace;letter-spacing:2px;color:var(--ink);background:var(--btn);
  border:4px solid var(--ink);box-shadow:inset 0 -4px 0 var(--btnsh);padding:12px 18px 14px}
#pyr button:active{box-shadow:none;transform:translateY(3px)}
#pyr #pyrsave{background:#f4c430;box-shadow:inset 0 -4px 0 #b0821a}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  #top{position:absolute;z-index:5;left:0;right:0;pointer-events:none;
    top:calc(env(safe-area-inset-top) + 8px);
    padding:0 calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px)}
  #top button{pointer-events:auto}
  #controls{position:absolute;left:0;right:0;height:auto;pointer-events:none;
    bottom:calc(env(safe-area-inset-bottom) + 24px);
    padding:0 calc(env(safe-area-inset-right) + 30px) 0 calc(env(safe-area-inset-left) + 30px)}
  #controls button{pointer-events:auto}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
  <button id="pause" aria-label="Pausar">
    <svg viewBox="0 0 10 11" shape-rendering="crispEdges"><rect x="0" y="0" width="4" height="11" fill="#1b1b1f"/><rect x="6" y="0" width="4" height="11" fill="#1b1b1f"/><rect x="1" y="1" width="2" height="7" fill="#ebe6dc"/><rect x="7" y="1" width="2" height="7" fill="#ebe6dc"/><rect x="1" y="8" width="2" height="2" fill="#8a6670"/><rect x="7" y="8" width="2" height="2" fill="#8a6670"/></svg>
  </button>
  <div class="right"><button id="spd"></button><button id="snd"></button></div>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="controls">
    <div class="dpad">
      <button id="bl" class="arrow" aria-label="Esquerda"><svg viewBox="0 0 18 24" shape-rendering="crispEdges"><polygon points="16,1 12,1 1,10.5 1,13.5 12,23 16,23" fill="#1b1b1f"/><polygon points="14,3 12,3 3.5,11 3.5,13 14,13" fill="#ebe6dc"/><polygon points="3.5,13 14,13 14,21 12.5,21" fill="#8a6670"/></svg></button>
      <button id="br" class="arrow" aria-label="Direita"><svg viewBox="0 0 18 24" shape-rendering="crispEdges"><polygon points="16,1 12,1 1,10.5 1,13.5 12,23 16,23" fill="#1b1b1f"/><polygon points="14,3 12,3 3.5,11 3.5,13 14,13" fill="#ebe6dc"/><polygon points="3.5,13 14,13 14,21 12.5,21" fill="#8a6670"/></svg></button>
    </div>
    <button id="bm" class="mouth" aria-label="Abrir a boca"><svg viewBox="0 0 24 24" shape-rendering="crispEdges"><circle cx="12" cy="12" r="11.5" fill="#1b1b1f"/><circle cx="12" cy="13" r="9.5" fill="#8a6670"/><circle cx="12" cy="11" r="9.5" fill="#ebe6dc"/><polygon points="7,13 9,7 12,11 15,7 17,13" fill="#e65a6e" stroke="#1b1b1f" stroke-width="1" stroke-linejoin="miter"/></svg></button>
  </div>
</div>
<div id="pyr" hidden>
  <img id="pyrimg" alt="Piramide de ovos">
  <div class="row"><button id="pyrsave">SALVAR</button><button id="pyrclose">VOLTAR</button></div>
</div>
<script>
(()=>{
const W=144,H=192,GROUND=172;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;

/* ---------- palette & sprites ---------- */
const PAL={k:'#1b1b1f',o:'#e8792b',d:'#b0521f',w:'#f6ecd8',p:'#e65a6e',s:'#9b6a43',c:'#d6c19c',
  r:'#cf4630',y:'#f4c430',g:'#9a9a9a',t:'#ffffff'};
function bake(rows,flip,pal=PAL){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  rows.forEach((r,y)=>{r=r.padEnd(w,'.');for(let x=0;x<w;x++){const ch=r[x];if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(flip?w-1-x:x,y,1,1);}}});
  return c;
}
const HEAD=[
"..kk........kk..",
".kook......kook.",
".kopokkkkkkopok.",
"kooooooooooooook",
"kookkooooookkook",
"kooooooooooooook",
"kowwwwwkkwwwwwok",
".kwwwwwwwwwwwwk.",
"..kkwwwwwwwwkk..",
];
const HEAD_OPEN=[
".kk..........kk.",
".ktk........ktk.",
".kwtk......ktwk.",
"..kwwkppppkwwk..",
"..kwwwkppkwwwk..",
".kkowwwkkwwwokk.",
"kookoowwwwookook",
"koookkooookkoook",
".kooooooooooook.",
];
// raposa sorrindo (olhos fechados de alegria), usada na piramide de ovos
const HEAD_SMILE=[
"..kk........kk..",
".kook......kook.",
".kopokkkkkkopok.",
"kookkooooookkook",
"kokookooookookok",
"kooooookkooooook",
"kowwkwwwwwwkwwok",
".kwwwkkkkkkwwwk.",
"..kkwwwwwwwwkk..",
];
const BODY=[
"...kooowwoook.kk",
"..kooowwwwoookok",
"..kooowwwwoookwk",
"..kooooooooookk.",
];
const LEGS=[
["...kdk....kdk...","...kkk....kkk..."],
["....kdk..kdk....","....kkk..kkk...."],
["..kdk......kdk..","..kkk......kkk.."],
];
const FOX={};
for(const [name,head] of [['c',HEAD],['o',HEAD_OPEN],['s',HEAD_SMILE]])
  LEGS.forEach((l,i)=>{const rows=[...head,...BODY,...l];FOX[name+i]=[bake(rows,false),bake(rows,true)];});

const EGG=bake([
"...kk...",
"..kwwk..",
".kwwwck.",
".kwswck.",
"kwwwwwck",
"kwswwwck",
"kwwwwsck",
"kwwwwwck",
".kwwwck.",
"..kkkk..",
]);
// ovo dourado: mesmo desenho do ovo, em ouro
const GOLD=bake([
"...kk...",
"..kwwk..",
".kwwwck.",
".kwswck.",
"kwwwwwck",
"kwswwwck",
"kwwwwsck",
"kwwwwwck",
".kwwwck.",
"..kkkk..",
],false,{...PAL,w:'#f4c430',c:'#b8861a',s:'#fff3b0'});
// ovo podre: casca verde-oliva com manchas marrons (cheiro desenhado por cima no render)
const ROTTEN=bake([
"...kk...",
"..kwwk..",
".kwwbck.",
".kbwwck.",
"kwwwwbck",
"kwbwwwck",
"kwwwbwck",
"kbwwwwck",
".kwwbck.",
"..kkkk..",
],false,{...PAL,w:'#a3ad5e',c:'#6f7a34',b:'#5c4426'});
// Variante B: disfarce do ovo podre por cor e detalhe (a forma ja e de ovo). A pista minima que nunca some
// sao os fiozinhos de cheiro animados (e a tremida na ultima fase), para nao depender so de cor.
const ROTTEN_FEW=[
"...kk...",
"..kwwk..",
".kwwwck.",
".kwwbck.",
"kwwwwwck",
"kwwwwwck",
"kwbwwwck",
"kwwwwwck",
".kwwwck.",
"..kkkk..",
];
const ROTTENS=[ROTTEN,
  bake(["...kk...","..kwwk..",".kwwbck.",".kbwwck.","kwwwwbck","kwbwwwck","kwwwbwck","kbwwwwck",".kwwbck.","..kkkk.."],false,{...PAL,c:'#b8ad7c',b:'#6e5232'}), // cor de ovo, manchas
  bake(ROTTEN_FEW,false,{...PAL,c:'#c4b98e',b:'#9a7c52'}),                                                                     // cor de ovo, 2 manchas pequenas
  bake(ROTTEN_FEW,false,{...PAL,c:'#c9be94',b:'#c9be94'})];                                                                    // cor de ovo, sem manchas
const BALL_ROWS=[[
"..kkkkk..",
".kwwwwwk.",
"kwwwwwwck",
"kwwwwwwck",
"krrrrrrrk",
"kwwwwwwck",
"kwwwwwwck",
".kwwwwck.",
"..kkkkk..",
],[
"..kkkkk..",
".kwwrwwk.",
"kwwwrwwck",
"kwwwrwwck",
"kwwwrwwck",
"kwwwrwwck",
"kwwwrwwck",
".kwwrwck.",
"..kkkkk..",
]];
// disfarce progressivo: fase 1 bola vermelha, fase 2 cor do ovo + listra vermelha, fase 3 listra sutil, fase 4 sem listra (so a forma)
const BALL_PALS=[{...PAL,w:'#e8604c',c:'#b03a2a',r:'#ffffff'},PAL,{...PAL,r:'#e2cfae'},{...PAL,r:PAL.w}];
const BALLS=BALL_PALS.map(p=>BALL_ROWS.map(r=>bake(r,false,p)));
const BALL=BALLS[1];
const HEART=bake([".kk.kk.","krrkrrk","krrrrrk",".krrrk.","..krk..","...k..."]);
const HEART0=bake([".kk.kk.","kggkggk","kgggggk",".kgggk.","..kgk..","...k..."]);
// colorful easter-style eggs for the egg rain: [shell, shade, pattern]
const EGG_COLS=[['#f7a1c4','#d9779f','#ffffff'],['#8ecdf5','#5e9ed0','#ffffff'],['#9be09a','#62b066','#fff6a8'],
  ['#ffe066','#d9b23a','#e65a6e'],['#c7a2f0','#9a74cf','#ffffff'],['#ffb36b','#d9853f','#ffffff']];
const RAIN_EGGS=EGG_COLS.map(c=>bake([
"...kk...",
"..kaak..",
".kaaabk.",
".kqqqbk.",
"kaaaaabk",
"kaqaqabk",
"kaaaaabk",
"kqqqqqbk",
".kaaabk.",
"..kkkk..",
],false,{...PAL,a:c[0],b:c[1],q:c[2]}));
const HEART_BIG=bake([".kk...kk.","krrk.krrk","krtrkrrrk","krrrrrrrk",".krrrrrk.","..krrrk..","...krk...","....k...."]);
const STAR=bake(["..y..",".yyy.","yyyyy",".yyy.","..y.."]);
// pintinho (olhando para a direita): [parado, pulando]
const CHICK_ROWS=[[
"..kkk...",
".kyyyk..",
".kykyyko",
".kyyyyk.",
"kyyyyyyk",
"kyyyyyyk",
".kkkkkk.",
"..o..o..",
],[
"..kkk...",
".kyyyk..",
".kykyyko",
"kkyyyykk",
"kyyyyyyk",
".kyyyyk.",
"..kkkk..",
"..o..o..",
]];
const CHICK=CHICK_ROWS.map(r=>[bake(r,false),bake(r,true)]);
// galinha (olhando para a direita): [parada, andando, voando asa pra cima, voando asa pra baixo]
const HEN_TOP=[
"........rr..",
".......rrrr.",
"......kwwwk.",
"......kwkwwo",
"......kwwwwoo",
"...k..kwwwr.",
"..kwk.kwwwr.",
];
const HEN_ROWS=[[...HEN_TOP,
".kwwwkwwwwk.",
"kwwwwccwwwk.",
"kwwwwwcwwwk.",
".kwwwwwwwk..",
"..kkkkkkk...",
"....o..o....",
"...oo.oo....",
],[...HEN_TOP,
".kwwwkwwwwk.",
"kwwwwccwwwk.",
"kwwwwwcwwwk.",
".kwwwwwwwk..",
"..kkkkkkk...",
"...o....o...",
"..oo...oo...",
],[
"..kk....rr..",
".kwck..rrrr.",
".kwwck.kwwwk",
"..kwwckwkwwo",
"...kwwkwwwwoo",
"...kwwkwwwr.",
"..kwkkkwwwr.",
".kwwwwwwwwk.",
"kwwwwwwwwwk.",
".kwwwwwwwk..",
"..kkkkkkk...",
"....o..o....",
],[...HEN_TOP,
".kwwwwwwwwk.",
"kwwwwwwwwwk.",
"kwwccwwwwwk.",
".kwwcccwwk..",
"..kkcwckkk..",
"....kk.o....",
]];
const HEN=HEN_ROWS.map(r=>[bake(r,false),bake(r,true)]);

/* ---------- fazenda: galinheiro, fazendeiro, toca e cascas (ver curva-de-dificuldade.md) ----------
   Da sentido a cada regra: as galinhas do poleiro botam os ovos; o fazendeiro joga as bolas (e pinta
   cada vez melhor = fases de disfarce); na Chuva de Ovos ele cochila; os pontos sao a pilha de ovos na
   toca; cada ovo que quebra vira uma casca no topo; com 5 cascas o fazendeiro acorda e a raposa foge. */
const LEDGE_Y=33; // topo da tabua do poleiro
const HEN_SIT=[...HEN_TOP,".kwwwkwwwwk.","kwwwwccwwwk.","kwwwwwcwwwk.",".kwwwwwwwk..","..kkkkkkk..."];
const HENS_SIT=[bake(HEN_SIT,false),bake(HEN_SIT,true)];
const HEN_GOLD=[bake(HEN_SIT,false,{...PAL,w:'#f4c430',c:'#b8861a'}),bake(HEN_SIT,true,{...PAL,w:'#f4c430',c:'#b8861a'})];
const HEN_SPOTS=[{x:2,f:0},{x:20,f:0},{x:108,f:1},{x:126,f:1}]; // longe dos numeros do HUD
const FARMER_TOP=[
"....hhhhh....",
"....hHHHh....",
"..hhhhhhhhh..",
"...kffffffk..",
];
const FARMER_BOT=[
"...kffffffk..",
"...kbbbbbbk..",
"....kbbbbk...",
"..kRRuRRuRRk.",
".kRRRuuuuRRRk",
".kRk.uuuu.kRk",
".kfk.uuuu.kfk",
];
const FPAL={...PAL,h:'#e8c15a',H:'#b8902e',f:'#f2c08a',b:'#8a5a3a',R:'#d84a3a',u:'#2f5aa8'};
const FARMER={
  awake:bake([...FARMER_TOP,"...kfkffkfk..",...FARMER_BOT],false,FPAL),
  sleep:bake([...FARMER_TOP,"...kkkffkkk..",...FARMER_BOT],false,FPAL),
  angry:bake([...FARMER_TOP,"...kkfffkkk..","...kfkffkfk..",...FARMER_BOT.slice(1)],false,FPAL)};
const FARMER_X=88;
// erros: casca inteira (cinza) = ainda nao errou; casca quebrada = ovo que caiu (verde = ovo podre comido, variante B)
const SHELL_OK=bake(["..kkk..",".kgggk.","kgggggk","kgggggk","kgggggk","kgggggk",".kgggk.","..kkk.."]);
const CRACK_ROWS=["..yyy..",".yyyyy.","kykykyk","kwkwkwk","kwwwwwk","kwwwwwk",".kwwwk.","..kkk.."]; // meia casca quebrada com a gema
const SHELL_BROKE=bake(CRACK_ROWS);
const SHELL_ROT=bake(CRACK_ROWS,false,{...PAL,w:'#a3ad5e',y:'#6f7a34'});
const MINI_EGG=bake([".kk.","kwwk","kwwk",".kk."]);
const PILE=(()=>{const c=document.createElement('canvas');c.width=9;c.height=8;const g=c.getContext('2d');
  g.drawImage(MINI_EGG,0,4);g.drawImage(MINI_EGG,5,4);g.drawImage(MINI_EGG,2,0);return c;})(); // pilha de 3 ovos

/* ---------- pixel font 3x5 ---------- */
const F={A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",
F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",
K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",
P:"110101110100100",Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",
U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",
Z:"111001010100111","0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110",
"4":"101101111001001","5":"111100110001110","6":"011100110101010","7":"111001010010010","8":"010101010101010",
"9":"010101011001110","!":"010010010000010",".":"000000000000010",":":"000010000010000","-":"000000111000000",
"?":"110001010000010","+":"000010111010000","=":"000111000111000"};
let TX=null; // contexto alternativo para o texto (ex.: imagem da piramide)
function text(s,x,y,sc=1,col=PAL.k,align='center',sh=null){
  const ctx=TX||cv.getContext('2d');
  s=String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
  const tw=s.length*4*sc-sc;
  let sx=align==='center'?Math.round(x-tw/2):align==='right'?x-tw:x;
  const draw=(ox,oy,c)=>{ctx.fillStyle=c;for(let n=0;n<s.length;n++){const g=F[s[n]];if(!g)continue;
    for(let i=0;i<15;i++)if(g[i]==='1')ctx.fillRect(sx+ox+n*4*sc+(i%3)*sc,y+oy+Math.floor(i/3)*sc,sc,sc);}};
  if(sh)draw(sc,sc,sh);
  draw(0,0,col);
}

/* ---------- background: ciclo dia/noite + clima ---------- */
// Dois relogios independentes:
//  1) Ceu: o sol comeca no topo, desce pela direita e se poe atras das colinas; a lua faz o mesmo
//     caminho a noite; o sol nasce pela esquerda e volta ao topo. A cor do ceu acompanha o sol.
//  2) Clima: comeca limpo, as nuvens vao aumentando, chove e depois abre de novo.
const TIMES=[ // cl = nuvem clara, rc = nuvem de chuva. Paletas vizinhas sao proximas, para a mistura ficar natural
 {sky:'#9fd3e0',b1:'#b3dde4',b2:'#c6e6e6',cl:'#eef7f5',rc:'#aab6bd',h1:'#a8cfa2',h2:'#7db37f',gt:'#7cbf6a',gr:'#4f8a4f',dirt:'#8a5a3c',dot:'#6e4630'}, // 0 dia
 {sky:'#a6d0dc',b1:'#d8dcb8',b2:'#f2dca4',cl:'#f7f1dc',rc:'#b0b4b0',h1:'#b4cf98',h2:'#88b274',gt:'#8cc064',gr:'#5a8a48',dirt:'#8a5a3a',dot:'#6e4630'}, // 1 tarde dourada
 {sky:'#c7808c',b1:'#ee9a6c',b2:'#f8c27a',cl:'#fbd2b0',rc:'#a88488',h1:'#b0946c',h2:'#8a7650',gt:'#a59a58',gr:'#5f6438',dirt:'#764a32',dot:'#5a3826'}, // 2 por do sol
 {sky:'#4c4580',b1:'#7c5488',b2:'#c06a7c',cl:'#6c5c90',rc:'#463e66',h1:'#55606a',h2:'#3e4a50',gt:'#4e6250',gr:'#2c4034',dirt:'#55392c',dot:'#3e2a20'}, // 3 crepusculo
 {sky:'#1c2547',b1:'#232e58',b2:'#2b376a',cl:'#3b4777',rc:'#2e3658',h1:'#2e4648',h2:'#223636',gt:'#3d5e45',gr:'#1f3a2c',dirt:'#4a3428',dot:'#36251c'}, // 4 noite
 {sky:'#38407a',b1:'#5c5890',b2:'#a77aa0',cl:'#5a5a8e',rc:'#3a3c66',h1:'#46585e',h2:'#344648',gt:'#4a6a52',gr:'#2a4434',dirt:'#523a2c',dot:'#3c2a20'}, // 5 pre-amanhecer

 {sky:'#acd2e0',b1:'#cfe2e6',b2:'#ece8d8',cl:'#f4f8f4',rc:'#adb7bc',h1:'#a6cfa0',h2:'#7ab27c',gt:'#7cbf6a',gr:'#4e894e',dirt:'#8a5a3c',dot:'#6e4630'}, // 7 manha

const CYCLE=150*60;   // volta completa do ceu: 2,5 min

// [fracao do ciclo, paleta]: entre duas paletas diferentes a cor troca em degraus
const SKYKEYS=[[0,0],[.28,0],[.38,1],[.44,1],[.50,2],[.54,2],[.60,3],[.66,4],[.76,4],[.80,5],[.85,6],[.89,6],[.94,7],[.98,0],[1,0]];
// [fracao do ciclo, angulo do sol]: 0 = topo, PI/2 = se pondo a direita, 3PI/2 = nascendo a esquerda
const SUNKEYS=[[0,0],[.38,1.0],[.56,1.78],[.80,2*Math.PI-1.78],[1,2*Math.PI]];
const ORBIT={cx:72,cy:145,rx:55,ry:110}; // topo em y=35, abaixo do HUD
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return c;}
function makeSky(p){const c=mk(),g=c.getContext('2d');
  g.fillStyle=p.sky;g.fillRect(0,0,W,H);
  g.fillStyle=p.b1;g.fillRect(0,110,W,30);
  g.fillStyle=p.b2;g.fillRect(0,128,W,20);
  return c;}
function makeLand(p){const c=mk(),g=c.getContext('2d');
  for(let x=0;x<W;x++){
    const h1=Math.round(18+8*Math.sin(x/13)+5*Math.sin(x/5.3+1));
    g.fillStyle=p.h1;g.fillRect(x,GROUND-h1-8,1,h1+8);
    const h2=Math.round(10+5*Math.sin(x/9+2)+3*Math.sin(x/4.1));
    g.fillStyle=p.h2;g.fillRect(x,GROUND-h2,1,h2);
  }
  g.fillStyle=p.gr;g.fillRect(0,GROUND,W,4);
  g.fillStyle=p.gt;g.fillRect(0,GROUND,W,1);
  g.fillStyle=p.dirt;g.fillRect(0,GROUND+4,W,H-GROUND-4);
  g.fillStyle=p.dot;
  for(let i=0;i<40;i++){g.fillRect((i*37)%W,GROUND+6+((i*13)%(H-GROUND-8)),2,1);}
  return c;}
// paletas intermediarias: cada degrau da transicao vira um fundo pre-renderizado (sem transparencia)
function mixCol(A,B,f){const x=parseInt(A.slice(1),16),y=parseInt(B.slice(1),16);
  return '#'+[16,8,0].map(sh=>Math.round((x>>sh&255)+((y>>sh&255)-(x>>sh&255))*f).toString(16).padStart(2,'0')).join('');}
function mixPal(A,B,f){const o={};for(const k in A)o[k]=mixCol(A[k],B[k],f);return o;}
const BG={};
function bgFor(a,b,f){const key=a===b||!f?a+'':a+'-'+b+'-'+f;
  if(!BG[key]){const p=key===a+''?TIMES[a]:mixPal(TIMES[a],TIMES[b],f);BG[key]={sky:makeSky(p),land:makeLand(p),pal:p};}
  return BG[key];}
for(let j=0;j<SKYKEYS.length-1;j++){const a=SKYKEYS[j][1],b=SKYKEYS[j+1][1];for(let k=0;k<=STEPS;k++)bgFor(a,b,k/STEPS);} // pre-renderiza tudo
function orb(r,col){const c=document.createElement('canvas');c.width=c.height=r*2+1;const g=c.getContext('2d');
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r){g.fillStyle=col;g.fillRect(x+r,y+r,1,1);}
  return c;}
const SUN=orb(9,'#fbe9a6'),SUN_LOW=orb(9,'#f8b45c');
// lua crescente (nao pode parecer uma bola redonda e clara)
const MOON=(()=>{const c=orb(6,'#c9d4ee'),g=c.getContext('2d');g.globalCompositeOperation='destination-out';
  for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++)if((x-3)*(x-3)+(y+2)*(y+2)<=30)g.fillRect(x+6,y+6,1,1);return c;})();
const STARS=[];{let z=7;const rnd=()=>(z=(z*16807)%2147483647)/2147483647;
  for(let i=0;i<28;i++)STARS.push({x:Math.floor(rnd()*W),y:Math.floor(4+rnd()*100),b:rnd()<.25,ph:Math.floor(rnd()*60)});}
let skyT=0,clouds=[],drops=[];
const q=(v,n=STEPS)=>Math.round(v*n)/n;
const ct=()=>(skyT%CYCLE)/CYCLE;
function lerpKeys(K,t){for(let j=0;j<K.length-1;j++){const [t0,a]=K[j],[t1,b]=K[j+1];if(t<=t1)return a+(b-a)*(t-t0)/(t1-t0);}return K[K.length-1][1];}
function skyMix(t){for(let j=0;j<SKYKEYS.length-1;j++){const [t0,a]=SKYKEYS[j],[t1,b]=SKYKEYS[j+1];
  if(t<=t1)return {a,b,f:a===b?0:q((t-t0)/(t1-t0))};}return {a:0,b:0,f:0};}
function nightK(t){return t<.58?0:t<.66?(t-.58)/.08:t<.76?1:t<.82?1-(t-.76)/.06:0;}
function orbitPos(th){return {x:Math.round(ORBIT.cx+ORBIT.rx*Math.sin(th)),y:Math.round(ORBIT.cy-ORBIT.ry*Math.cos(th))};}

/* clima: limpo -> nuvens aumentando -> chuva -> abrindo -> limpo ... */
const wx={phase:'clear',t:0,len:1,cloud:0,rain:0};
function wxGo(phase,secs){wx.phase=phase;wx.len=wx.t=Math.round(secs*60);}
function resetWeather(){wxGo('clear',25+Math.random()*20);wx.cloud=0;wx.rain=0;clouds=[];drops=[];wt=0;windPlan=[];}
/* vento: so na chuva. Empurra ovos e bolas para os dois lados (vira de direcao no meio da chuva).
   O roteiro e decidido no inicio da chuva, entao cada objeto ja nasce sabendo onde vai cair:
   a regra de alcance vale para o ponto de pouso real. */
const WIND_MAX=.22;      // px por passo na rajada mais forte
let wt=0,windPlan=[];    // wt = relogio do vento (so anda durante a partida)
// roteiro criado quando as nuvens comecam a chegar (antes da chuva), para nenhum objeto em queda ser pego de surpresa
function planWind(start,len){
  start=Math.max(start,windPlan.length?windPlan[windPlan.length-1][0]:0);
  windPlan=windPlan.filter(k=>k[0]>=wt-900);
  let f=start,d=Math.random()<.5?-1:1,v=0;const end=start+len;windPlan.push([f,0]);
  const ramp=(to,dur)=>{f+=dur;v=to;windPlan.push([f,v]);};
  ramp(d*WIND_MAX*(.7+Math.random()*.3),120);                       // entra soprando para um lado
  while(f<end-200){
    ramp(v,Math.round(150+Math.random()*180));                       // segura
    d=-d;ramp(d*WIND_MAX*(.6+Math.random()*.4),Math.round(120+Math.random()*60)); // vira para o outro lado
  }
  ramp(v,Math.max(0,end-f));ramp(0,150);                             // acalma quando a chuva para
}
function windAt(f){const P=windPlan;if(!P.length||f<=P[0][0]||f>=P[P.length-1][0])return 0;
  for(let j=1;j<P.length;j++)if(f<=P[j][0]){const [f0,a]=P[j-1],[f1,b]=P[j];return a+(b-a)*(f-f0)/(f1-f0);}return 0;}
resetWeather();
function stepWeather(){
  const k=1-wx.t/wx.len; // progresso da fase (0 -> 1)
  if(wx.phase==='clear')wx.cloud=0;
  else if(wx.phase==='build')wx.cloud=k;            // nuvens vao aumentando
  else if(wx.phase==='rain')wx.cloud=1;
  else if(wx.phase==='clearup')wx.cloud=1-k;        // ceu abrindo
  const rainTarget=wx.phase==='rain'?1:0;
  wx.rain+=Math.sign(rainTarget-wx.rain)*Math.min(Math.abs(rainTarget-wx.rain),1/90);
  if(--wx.t>0)return;
  if(wx.phase==='clear'){wxGo('build',12+Math.random()*6);wx.next=Math.round((12+Math.random()*8)*60);planWind(wt+wx.len,wx.next);}
  else if(wx.phase==='build')wxGo('rain',wx.next/60);
  else if(wx.phase==='rain')wxGo('clearup',8+Math.random()*4);
  else wxGo('clear',35+Math.random()*30);
}
function spawnCloud(){const s=wx.cloud>.55?(Math.random()<.7?2:1):wx.cloud>.25?(Math.random()<.5?1:0):0;
  clouds.push({x:Math.round(-34+Math.random()*(W+20)),y:Math.round(16+Math.random()*84),s,v:.04+Math.random()*.04,a:0,out:false});}
function updateWorld(){
  if(state==='play'){wt++;stepWeather();}
  const wind=state==='play'?windAt(wt):0;
  // nuvens: quantidade acompanha o clima, entram e saem com fade em degraus
  const want=Math.round(wx.cloud*14),alive=clouds.filter(c=>!c.out);
  if(alive.length<want&&frame%15===0)spawnCloud();
  if(alive.length>want&&frame%15===0)alive[0].out=true;
  for(const c of clouds){c.x+=c.v*(1+wx.cloud*2)+wind*1.5;if(c.x>W+4)c.x=-40;else if(c.x<-40)c.x=W+4;
    c.a=c.out?c.a-1/40:Math.min(1,c.a+1/40);}
  clouds=clouds.filter(c=>c.a>0||!c.out);
  // chuva
  const n=wx.rain*2.2;
  for(let j=0;j<Math.floor(n)+(Math.random()<n%1?1:0);j++)drops.push({x:-48+Math.random()*(W+96),y:-4-Math.random()*20});
  const dc=nightK(ct())>.5?'#8fa6c8':'#dceaf2';
  for(const d of drops){d.x+=-.3+wind*7;d.y+=4.5;
    if(d.y>=GROUND){d.dead=true;if(Math.random()<.3)parts.push({x:d.x,y:GROUND-1,vx:(Math.random()-.5)*.6,vy:-.7,life:6,c:dc});}}
  drops=drops.filter(d=>!d.dead&&d.x>-52&&d.x<W+52);
}
function drawCloud(x,y,s){
  if(s===0){ctx.fillRect(x,y,16,3);ctx.fillRect(x+3,y-2,8,2);}
  else if(s===1){ctx.fillRect(x,y,22,4);ctx.fillRect(x+4,y-3,12,3);ctx.fillRect(x+9,y-5,6,2);}
  else{ctx.fillRect(x,y,34,5);ctx.fillRect(x+5,y-4,16,4);ctx.fillRect(x+12,y-7,10,3);ctx.fillRect(x+22,y-3,8,3);}
}
function drawWorld(){
  const t=ct(),m=skyMix(t),bgx=bgFor(m.a,m.b,m.f),pal=bgx.pal;
  const cov=q(clamp((wx.cloud-.35)/.65,0,1)); // ceu so fecha depois que as nuvens ja chegaram
  ctx.drawImage(bgx.sky,0,0);
  // estrelas (somem com as nuvens)
  const n=q(nightK(t)*(1-cov));
  if(n>0){ctx.globalAlpha=n;ctx.fillStyle='#f4f1e0';
    for(const s of STARS){if(s.b&&Math.floor((frame+s.ph)/30)%4===0)continue;ctx.fillRect(s.x,s.y,1,1);}
    ctx.globalAlpha=1;}
  const th=lerpKeys(SUNKEYS,t),dim=q(1-cov*.85);
  // sol: amarelo no alto, laranja perto do horizonte
  {const p=orbitPos(th);if(p.y<160){ctx.globalAlpha=dim;ctx.drawImage(Math.cos(th)>.45?SUN:SUN_LOW,p.x-9,p.y-9);ctx.globalAlpha=1;}}
  // lua: lado oposto da orbita, so a noite
  {const nk=q(nightK(t)),p=orbitPos(th+Math.PI);if(nk>0&&p.y<160){ctx.globalAlpha=Math.min(nk,dim);ctx.drawImage(MOON,p.x-6,p.y-6);ctx.globalAlpha=1;}}
  // nuvens
  ctx.fillStyle=wx.cloud>.65?pal.rc:pal.cl;
  for(const c of clouds){const a=q(c.a,4);if(!a)continue;ctx.globalAlpha=a;drawCloud(Math.round(c.x),c.y,c.s);}
  ctx.globalAlpha=1;
  ctx.drawImage(bgx.land,0,0);
  // ceu fechado escurece a paisagem (nao os itens)
  if(cov>0){ctx.fillStyle='rgba(58,66,84,'+(cov*.4)+')';ctx.fillRect(0,0,W,GROUND+4);}
}
function drawDrops(){
  if(!drops.length)return;
  ctx.fillStyle=nightK(ct())>.5?'rgba(143,166,200,.8)':'rgba(220,234,242,.75)';
  const sl=(state==='play'?windAt(wt):0)>.05?1:-1;
  for(const d of drops){const x=Math.round(d.x),y=Math.round(d.y);ctx.fillRect(x,y,1,2);ctx.fillRect(x+sl,y+2,1,2);}
}

let ac=null,master=null,noiseBuf=null,silentEl=null,muted=false;
try{muted=localStorage.getItem('eggsplash-mute')==='1'}catch(e){}
function silentWav(){const n=4410,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!ac){try{
    ac=new(window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=muted?0:.9;
    const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
    const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }catch(e){ac=null;return;}}
  if(ac.state!=='running')ac.resume().catch(()=>{});
  try{const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);}catch(e){}
  // iOS: an HTML audio element switches the session to "playback" so the silent switch doesn't mute the game
  if(!silentEl&&!navigator.audioSession){try{silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute('playsinline','');}catch(e){}}
  if(silentEl&&silentEl.paused)silentEl.play().catch(()=>{});
}
function setMuted(m){muted=m;try{localStorage.setItem('eggsplash-mute',m?'1':'0')}catch(e){}
  if(master)master.gain.setTargetAtTime(m?0:.9,ac.currentTime,.02);}
function tone(f1,f2,dur,type='square',vol=.07,delay=0){if(!ac||muted)return;try{
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);}catch(e){}}

  const t=ac.currentTime+delay,s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(f1,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.03);}catch(e){}}

/* Variante B (ver curva-de-dificuldade.md): o ovo podre substitui a bola como obstaculo principal.
   Ativar: abrir o jogo com ?variante=b (fica salvo); voltar: ?variante=a.
   - mesma curva (% de bolas vira % de ovos podres), mesmas regras de sequencia e de apresentacao de fase
   - encostar no corpo = igual a bola (60 frames parada, vomitando); comer = perde 1 vida
   - cheiro so em 1 de cada 5 que caem, por 2 s, um de cada vez
   - a bola volta como novidade a partir de 50 pts (sem disfarce), ate 30% dos objetos ruins */
const VB=(()=>{try{const m=location.search.match(/[?&]variante=([ab])/i);
  if(m)localStorage.setItem('eggsplash-variante',m[1].toLowerCase());
  return localStorage.getItem('eggsplash-variante')==='b';}catch(e){return /[?&]variante=b/i.test(location.search);}})();
const BAD=VB?'rotten':'ball';
const B_HIT_T=60,B_EAT_T=40,B_STINK_EVERY=5,B_STINK_LIFE=2*60,B_BALL_FROM=50;
const bBallShare=s=>s<B_BALL_FROM?0:Math.min(.3,.1+(s-B_BALL_FROM)*.004);
let ballSeen=false,rotDrops=0;
let losses=[]; // causa de cada casca quebrada no topo: 'egg' ou 'rot'
let eaten=[],hatched=0; // ovos que a raposa comeu (-1 = ovo normal, -2 = dourado, 0..5 = cor da Chuva de Ovos) e ovos que viraram pintinho
try{best=+localStorage.getItem('eggsplash-best')||0}catch(e){}
const fox={x:W/2-8,vx:0,face:1,mouth:false,stun:0,inv:0,chew:0,walk:0,slip:false,onP:false,halt:0,sick:0,stink:false,big:0};
const keys={l:false,r:false,m:false},touch={l:false,r:false,m:false};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hit=(a,aw,ah,b)=>a.x<b.x+b.w&&a.x+aw>b.x&&a.y<b.y+b.h&&a.y+ah>b.y;

function reset(){lvlT=0;lvl=1;skyT=0;resetWeather();score=0;lives=5;heartsToDrop=0;heartPlan=[];combo=0;rainT=0;timerT=0;recent=[];spawned=0;ballRun=0;eggRun=0;lastBallPhase=-1;lastEgg={x:W/2-4,arr:frame+60};items=[];parts=[];puddles=[];spawnT=50;newBest=false;bird=null;hatchCD=0;eaten=[];hatched=0;losses=[];stinks=[];rotSeen=false;ballSeen=false;rotDrops=0;closePyr();
  Object.assign(fox,{x:W/2-8,vx:0,stun:0,inv:0,chew:0,walk:0,halt:0,sick:0,stink:false,big:0});state='play';sfx.start();}
// Curva de dificuldade (ver curva-de-dificuldade.md no projeto). s = ovos comidos.
// Sobe rapido no inicio e se aproxima de um teto justo: queda 3,0s -> 1,6s, intervalo 1,6s -> 0,7s, bolas 0% -> 50%.
const fallCache=new Map();
function vmaxFor(frames){ // velocidade maxima para um ovo levar ~frames do topo ate a raposa
  if(fallCache.has(frames))return fallCache.get(frames);
  let lo=.6,hi=6;for(let i=0;i<30;i++){const m=(lo+hi)/2;if(fallFrames(m,GROUND-26)>frames)lo=m;else hi=m;}
  fallCache.set(frames,hi);return hi;}
const phaseOf=s=>s<10?0:s<30?1:s<50?2:3;
function level(){const s=score,fall=Math.round(60*(1.6+1.4*Math.exp(-s/40)));
  return{fall,vmax:vmaxFor(fall),interval:Math.round(60*(.7+.9*Math.exp(-s/35))),
    ballP:.5*(1-Math.exp(-s/25)),maxOn:s<5?1:s<20?2:s<100?3:4,phase:phaseOf(s)};}
function fallFrames(vmax,target){let y=-12,vy=.5,n=0;while(y<target&&n<900){vy=Math.min(vy+.025,vmax);y+=vy;n++;}return n;}
// onde um objeto que nasce agora em x0 vai estar quando chegar a altura target (mesma conta do update)
function landX(x0,vmax,target,w){let y=-12,vy=.5,x=x0,n=0;
  while(y<target&&n<900){vy=Math.min(vy+.025,vmax);y+=vy;x=clamp(x+windAt(wt+n),0,W-w);n++;}return x;}
// x de nascimento para cair em land; null se precisaria nascer fora da tela
function spawnXFor(land,vmax,target,w){
  if(!windPlan.length)return land;
  let x0=land;for(let k=0;k<3;k++)x0+=land-landX(x0,vmax,target,w);
  return x0>=2&&x0<=W-w-2&&Math.abs(landX(x0,vmax,target,w)-land)<1?x0:null;}
// every drop is placed so it is always possible: eggs reachable from the previous egg, balls never on top of an egg
// returns frames until the next spawn attempt
function spawn(){
  const L=level();
  const falling=items.filter(i=>!i.rain&&i.type!=='heart'&&i.state==='fall').length;
  if(falling>=L.maxOn)return 6;
  // BAD = objeto ruim principal: bola (A) ou ovo podre (B)
  let type=spawned<3?'egg':Math.random()<L.ballP?BAD:'egg';    // os 3 primeiros sao sempre ovos
  if(type===BAD&&ballRun>=3)type='egg';                          // no maximo 3 ruins seguidos
  if(type==='egg'&&spawned>=3&&score>=20&&eggRun>=6)type=BAD;    // depois de 20, no maximo 6 ovos seguidos
  const phaseIntro=spawned>=4&&L.phase>lastBallPhase;
  if(phaseIntro)type=BAD;                                        // cada fase apresenta seu disfarce logo no inicio
  if(!VB&&type==='egg'&&spawned>=3&&((score>=ROT_FROM&&!rotSeen)||Math.random()<rotP(score)))type='rotten'; // A: ovo podre extra; o primeiro e garantido ao chegar em ROT_FROM
  if(VB&&type==='rotten'&&!phaseIntro&&score>=B_BALL_FROM&&(!ballSeen||Math.random()<bBallShare(score)))type='ball'; // B: bola como novidade tardia
  const intro=(phaseIntro&&type===BAD)||(!VB&&type==='rotten'&&!rotSeen)||(VB&&type==='ball'&&!ballSeen); // apresentacao:
  if(intro&&falling>0)return 6;                                  // cai sozinha...
  const fall=intro?Math.round(L.fall*1.3):L.fall,vmax=intro?vmaxFor(fall):L.vmax; // ...e 30% mais devagar
  const arr=frame+fallFrames(vmax,type!=='ball'?GROUND-26:GROUND-23);
  recent=recent.filter(r=>r.arr>frame-20);
  // x = onde vai CAIR (as regras valem para o pouso); sx = onde nasce, ja descontando o vento
  const tgt=type!=='ball'?GROUND-26:GROUND-23,wd=type!=='ball'?8:9;
  let x=0,sx=0,ok=false;
  for(let i=0;i<24&&!ok;i++){
    if(type==='egg'){
      const reach=Math.max(8,(stinks.length?.8:1.2)*(arr-lastEgg.arr)); // com cheiro no chao a raposa pode estar lenta
      x=clamp(lastEgg.x+(Math.random()*2-1)*reach,4,W-12);
      ok=!recent.some(r=>r.type!=='egg'&&Math.abs(r.arr-arr)<32&&Math.abs(r.x-x)<20);
    }else{
      x=4+Math.random()*(W-(type==='ball'?17:16)); // bola e ovo podre: nunca em cima de um ovo
      ok=!recent.some(r=>r.type==='egg'&&Math.abs(r.arr-arr)<32&&Math.abs(r.x-x)<22);
    }
    if(ok){sx=spawnXFor(x,vmax,tgt,wd);ok=sx!==null;}
  }
  if(!ok)return L.interval;
  if(type==='egg'){lastEgg={x,arr};eggRun++;ballRun=0;}
  else if(type===BAD||VB){ballRun++;eggRun=0;if(type===BAD)lastBallPhase=L.phase;if(type==='rotten')rotSeen=true;else ballSeen=true;}
  else rotSeen=true; // A: ovo podre extra
  spawned++;
  recent.push({type,x,arr});
  const gold=type==='egg'&&score>=GOLD_FROM&&fox.big===0&&!items.some(i=>i.gold)&&Math.random()<GOLD_P;
  const hatch=!gold&&type==='egg'&&!bird&&hatchCD===0&&combo>=HATCH_COMBO&&!items.some(i=>i.hatch)&&Math.random()<HATCH_P;
  items.push({type,x:sx,y:-12,vx:0,vy:.5,state:'fall',t:0,vmax,ph:VB&&type==='ball'?0:L.phase,intro,hatch,gold,land:x});
  return intro?L.interval+Math.round(fall*.6):L.interval;
}
function spawnRain(){items.push({type:'egg',x:4+Math.random()*(W-12),y:-12,vx:0,vy:.5+Math.random()*.8,state:'fall',t:0,rain:true,col:Math.floor(Math.random()*EGG_COLS.length)});}
// lost hearts come back during the rain, dropped on the side farthest from the fox
function spawnHeart(bx){items.push({type:'heart',x:bx,bx,y:-10,vx:0,vy:0,state:'fall',t:0});}
// lost hearts come back during the rain, spread over the whole rain and across the whole screen (shuffled lanes)
function planHearts(n){
  const lanes=[...Array(n)].map((_,i)=>Math.round(8+(n>1?i*(W-25)/(n-1):(W-25)/2)));
  for(let i=lanes.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[lanes[i],lanes[j]]=[lanes[j],lanes[i]];}
  const span=RAIN_LEN-100;
  return lanes.map((x,i)=>({k:30+Math.round((i+.5)*span/n),x}));
}
function startRain(){
  rainT=RAIN_LEN;heartsToDrop=5-lives;heartPlan=planHearts(heartsToDrop);sfx.rain();
  for(const it of items)if(it.type==='ball'||it.type==='rotten'){it.dead=true;burst(it.x+4,it.y+4,8,[PAL.t,PAL.y],1.2,1.2);}
  items=items.filter(i=>!i.dead);
}
function burst(x,y,n,colors,spd=1.5,up=1.5){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*spd*2,vy:-Math.random()*up-.3,
  life:25+Math.random()*20,c:colors[i%colors.length]});}
function gameOver(){state='over';overT=0;if(score>best){best=score;newBest=true;try{localStorage.setItem('eggsplash-best',best)}catch(e){}}sfx.over();if(newBest)sfx.record();}

function breakEgg(it){
  it.dead=true;const cx=it.x+4;
  if(it.gold){burst(cx,GROUND-2,10,[PAL.y,'#b8861a','#fff3b0'],1.3,1.6);sfx.heartLost();return;} // perder o dourado nao tira vida
  if(it.rain||rainT>0){const c=it.rain?EGG_COLS[it.col]:[PAL.w,PAL.c];burst(cx,GROUND-2,5,[c[0],c[1]],1.2,1.4);burst(cx,GROUND-2,3,[PAL.y],.8,1);sfx.splat();
    puddles.push({x:Math.round(cx-11),w:22,life:Infinity,rain:true,col:it.rain?it.col:null});return;}
  lives--;losses.push('egg');combo=0;shake=5;sfx.crack();if(lives>0)sfx.hurt();
  puddles.push({x:Math.round(cx-11),w:22,life:Infinity}); // puddles stay until the next egg rain ends
  burst(cx,GROUND-2,6,[PAL.w,PAL.c],1.4,1.8);burst(cx,GROUND-2,5,[PAL.y],1,1.2);
  if(lives<=0)gameOver();
}

/* ---------- ovo podre ---------- */
// cai no chao: nao tira vida, mas deixa uma nuvem de cheiro que deixa a raposa lenta
function breakRotten(it){
  it.dead=true;const cx=it.x+4;sfx.rotten();
  burst(cx,GROUND-2,7,['#a3ad5e','#6f7a34','#5c4426'],1.3,1.6);
  if(VB){ // B: so 1 de cada 5 deixa cheiro, curto, e nunca mais de uma nuvem
    if(++rotDrops%B_STINK_EVERY||stinks.length)return;
    stinks.push({x:Math.round(cx-STINK_W/2),w:STINK_W,life:B_STINK_LIFE});return;}
  stinks=stinks.filter(z=>Math.abs(z.x+STINK_W/2-cx)>STINK_W/2); // um cheiro novo no mesmo lugar substitui o antigo
  stinks.push({x:Math.round(cx-STINK_W/2),w:STINK_W,life:STINK_LIFE});
}
// comeu: vomita e fica parado um instante (sem perder vida, mas zera o combo e nao conta ponto)
function eatRotten(it){
  it.dead=true;combo=0;fox.sick=VB?B_EAT_T:SICK_T;fox.vx=0;fox.chew=0;shake=3;sfx.vomit();
  if(VB){lives--;losses.push('rot');shake=5;if(lives>0)sfx.hurt();else gameOver();} // B: comer o obstaculo principal custa uma vida
}
// B: ovo podre que encosta no corpo tem o mesmo peso da bola (60 frames parada), mas vomitando em vez de tonta
function splatRotten(it){
  it.dead=true;burst(it.x+4,it.y+5,8,['#a3ad5e','#6f7a34','#5c4426'],1.4,1.4);sfx.rotten();
  if(fox.sick===0&&fox.inv===0){combo=0;fox.sick=B_HIT_T;fox.vx*=fox.onP?1:0;fox.chew=0;shake=5;sfx.vomit();}
}

/* ---------- ovo dourado ---------- */
function eatGold(it){
  it.dead=true;score+=GOLD_PTS;combo++;fox.chew=16;eaten.push(-2);
  fox.big=BIG_T;fox.stun=0;fox.sick=0;fox.halt=0;fox.inv=0;sfx.power();
  burst(fox.x+8,GROUND-16,16,[PAL.y,'#fff3b0',PAL.t],1.8,2.2);
  if(bird&&bird.kind==='hen')henFly(0);
}
const bigK=()=>{const b=fox.big;if(!b)return 1; // escala para desenhar: cresce piscando no inicio e pisca antes de acabar
  if(b>BIG_T-BIG_GROW)return Math.floor((BIG_T-b)/5)%2?2:1.5;
  if(b<BIG_WARN)return Math.floor(b/(b<40?4:8))%2?1:2;return 2;};
// invencivel: o que encosta na raposa gigante sai voando
function smashAway(it){
  it.state='bounce';it.t=0;it.b=1;it.vy=-2.6;it.vx=(it.x+4<fox.x+8?-1:1)*2.2;sfx.smash();
  burst(it.x+4,it.y+4,6,[PAL.y,PAL.t],1.4,1.4);
}

/* ---------- pintinho -> galinha ---------- */
// O ovo marcado choca quando chega perto da boca da raposa: conta como pego (+1) e sai um pintinho.
function hatchEgg(it){
  it.dead=true;score++;combo++;hatched++;sfx.hatch();
  const cx=it.x+4,cy=it.y+5;
  burst(cx,cy,8,[PAL.w,PAL.c,PAL.t],1.2,1.4);
  bird={kind:'chick',x:clamp(cx-4,2,W-10),y:cy-4,vx:(cx<fox.x+8?-1:1)*.7,vy:-1.6,t:0,face:cx<fox.x+8?-1:1,ground:false,hopT:20};
}
const henBox=b=>({x:b.x+1,w:10});
function updateBird(){
  if(hatchCD>0&&!bird)hatchCD--;
  if(!bird)return;
  const b=bird;b.t++;
  if(b.kind==='chick'||b.kind==='grow'){
    // pulinhos pelo chao; atravessa a raposa sem atrapalhar
    b.vy+=.12;b.x+=b.vx;b.y+=b.vy;
    if(b.x<2){b.x=2;b.vx=Math.abs(b.vx);b.face=1;}
    if(b.x>W-10){b.x=W-10;b.vx=-Math.abs(b.vx);b.face=-1;}
    if(b.y>=GROUND-8){b.y=GROUND-8;b.vy=0;b.vx=0;b.ground=true;}
    if(b.kind==='chick'){
      // foge da raposa: se ela chega perto, pula para longe na hora; encurralado na parede, pula por cima dela
      const dx=b.x+4-(fox.x+8),near=fox.big?CHICK_FLEE+8:CHICK_FLEE;
      if(b.ground&&Math.abs(dx)<near){
        let d=dx<0?-1:1;
        const stuck=d<0?b.x<14:b.x>W-22;
        if(stuck){d=-d;b.vy=-2.7;b.vx=d*1.7;}else{b.vy=-1.5;b.vx=d*1.4;}
        b.ground=false;b.face=d;b.hopT=12;
        if(!b.scared||b.t-b.scared>40){b.scared=b.t;sfx.chirp();}
      }else if(b.ground&&--b.hopT<=0){b.ground=false;b.vy=-1.2-Math.random()*.6;
        let d=Math.random()<.5?-1:1;if(b.x<20)d=1;if(b.x>W-28)d=-1;
        b.vx=d*(.4+Math.random()*.5);b.face=d;b.hopT=25+Math.floor(Math.random()*30);}
      if(b.t%50===0)sfx.chirp();
      // vira galinha depois de um tempo, mas so longe da raposa (para nascer sem encostar nela)
      if(b.t>=CHICK_LIFE&&b.ground&&Math.abs(b.x+4-(fox.x+8))>22){b.kind='grow';b.t=0;sfx.grow();}
    }else if(b.t>=GROW_T){
      b.kind='hen';b.t=0;b.x=clamp(b.x-2,0,W-12);b.y=GROUND-14;b.walk=0;
      {const hb=henBox(b),fl=fox.x+3;if(fl+10>hb.x&&fl<hb.x+hb.w) // nasce sem encostar na raposa
        b.x=hb.x+hb.w/2<fl+5?(fl-hb.w-2>=0?fl-hb.w-3:fl+12):(fl+12<=W-12?fl+12:fl-hb.w-3);}
      burst(b.x+6,b.y+4,12,[PAL.t,PAL.w,PAL.r],1.4,1.6);sfx.cluck();
    }
    return;
  }
  if(b.kind==='hen'){
    // anda devagar ate ficar colada do lado da raposa e fica ali, de bloqueio
    const fb={x:fox.x+3,w:10},hb=henBox(b);
    const side=hb.x+hb.w/2<fb.x+fb.w/2?-1:1; // de que lado da raposa a galinha esta
    const target=side<0?fb.x-hb.w-2:fb.x+fb.w+2;
    const dx=target-hb.x;
    if(Math.abs(dx)>.5){const v=Math.sign(dx)*Math.min(.35,Math.abs(dx));b.x=clamp(b.x+v,0,W-12);b.walk++;b.face=Math.sign(dx);}
    else b.face=-side;
    if(b.t%90===45)sfx.cluck();
    if(b.t>=HEN_LIFE)henFly(0);
    return;
  }
  if(b.kind==='fly'){
    b.vy=Math.max(b.vy-.06,-2.4);b.x+=b.vx;b.y+=b.vy;
    if(b.t%8===0)sfx.flap();
    if(b.t%5===0)parts.push({x:b.x+6,y:b.y+8,vx:(Math.random()-.5)*.6,vy:.3,life:30,c:Math.random()<.5?PAL.t:PAL.w});
    if(b.y<-20||b.x<-20||b.x>W+8){bird=null;hatchCD=HATCH_CD;}
  }
}
function henFly(dir){
  const b=bird;const d=dir||(b.x+6<fox.x+8?-1:1);
  Object.assign(b,{kind:'fly',t:0,vx:d*1.1,vy:-1.4,face:d});
  burst(b.x+6,b.y+6,14,[PAL.t,PAL.w,PAL.c],1.6,1.8);
}
// a raposa nao atravessa a galinha: bate, para, e a galinha sai voando
function henBlock(){
  if(!bird||bird.kind!=='hen')return;
  const hb=henBox(bird),fl=fox.big?fox.x-2:fox.x+3,fr=fox.big?fox.x+18:fox.x+13;
  if(fr<=hb.x||fl>=hb.x+hb.w)return;
  if(fox.big){sfx.cluck();henFly(hb.x+hb.w/2<fox.x+8?-1:1);return;} // gigante: a galinha sai voando sem parar a raposa
  const fromLeft=fl+5<hb.x+hb.w/2;
  fox.x=fromLeft?hb.x-13:hb.x+hb.w-3;
  fox.vx=0;fox.halt=HALT_T;shake=3;sfx.cluck();sfx.bonk();
  burst(fromLeft?hb.x:hb.x+hb.w,GROUND-10,6,[PAL.t,PAL.w],1.2,1.2);
  henFly(fromLeft?1:-1);
}

function update(){
  frame++;
  if(state==='play'||state==='title')skyT++;
  if(state!=='pause')updateWorld();
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--;if(p.y>GROUND){p.y=GROUND;p.vx*=.5;p.vy=0;}}
  parts=parts.filter(p=>p.life>0);
  if(state==='over'){overT++;return;}
  if(state!=='play')return;
  if(shake>0)shake--;if(lvlT>0)lvlT--;
  const L=level();
  if(rainT>0){
    rainT--;if(frame%6===0)spawnRain();
    {const k=RAIN_LEN-rainT;while(heartPlan.length&&k>=heartPlan[0].k){spawnHeart(heartPlan.shift().x);heartsToDrop--;}}
    if(rainT===0){for(const p of puddles)burst(p.x+11,GROUND-2,3,[PAL.t,PAL.y],1,1.2);puddles=[];stinks=[]; // rain end cleans the whole floor
      for(const it of items)if(it.rain){it.dead=true;burst(it.x+4,it.y+5,4,[PAL.t,PAL.y],1,1);}
      timerT=0;spawnT=45;lastEgg={x:fox.x+4,arr:frame+45};recent=[];sfx.rainEnd();lvl++;lvlT=60;}
  }else{
    timerT++;
    const left=RAIN_EVERY-timerT;
    if(left<=180&&left%60===0&&left>0)sfx.tick();
    if(timerT>=RAIN_EVERY)startRain();
    else if(--spawnT<=0)spawnT=spawn();
  }

  updateBird();

  // fox
  const cx=fox.x+8;
  fox.onP=puddles.some(p=>cx>p.x&&cx<p.x+p.w);
  fox.stink=!fox.big&&stinks.some(z=>cx>z.x&&cx<z.x+z.w);
  if(fox.big>0){fox.big--;if(fox.big===0)sfx.powerEnd();
    if(frame%4===0)parts.push({x:fox.x+8+(Math.random()-.5)*26,y:GROUND-4-Math.random()*28,vx:0,vy:-.5,life:18,c:Math.random()<.5?PAL.y:'#fff3b0'});}
  let dir=0;
  if(fox.stun>0){if(--fox.stun===0){fox.inv=40;sfx.wake();}else if(fox.stun%20===0)sfx.dizzy();}
  else if(fox.halt>0){fox.halt--;fox.vx=0;}
  else if(fox.sick>0){fox.sick--;fox.vx=0;
    if(fox.sick%3===0)parts.push({x:fox.x+8+fox.face*5,y:GROUND-12,vx:fox.face*(.6+Math.random()*.6),vy:-.3-Math.random()*.6,life:30,
      c:['#a3ad5e','#8fa040','#c9cf7a'][Math.floor(Math.random()*3)]});}
  else{if(keys.l||touch.l)dir--;if(keys.r||touch.r)dir++;}
  if(fox.inv>0)fox.inv--;
  fox.mouth=fox.stun===0&&fox.sick===0&&(keys.m||touch.m);if(fox.mouth&&!prevMouth)sfx.mouth();prevMouth=fox.mouth;
  const slow=fox.stink?STINK_SLOW:1,max=(fox.mouth?1.0:1.8)*slow;
  if(fox.onP){
    if(dir)fox.vx+=dir*.04*slow;else fox.vx*=.993;
    fox.vx=clamp(fox.vx,-2.2*slow,2.2*slow);
  }else{
    if(dir){fox.vx+=dir*.45;fox.vx=clamp(fox.vx,-max,max);}
    else{fox.vx*=.6;if(Math.abs(fox.vx)<.05)fox.vx=0;}
  }
  fox.x+=fox.vx;
  const xm=fox.big?8:0; // gigante: 32 px de largura, centrada no mesmo ponto
  if(fox.x<xm){fox.x=xm;fox.vx=fox.onP?-fox.vx*.5:0;}
  if(fox.x>W-16-xm){fox.x=W-16-xm;fox.vx=fox.onP?-fox.vx*.5:0;}
  henBlock();
  if(dir)fox.face=dir;
  fox.slip=fox.onP&&Math.abs(fox.vx)>.35;
  if(dir)fox.walk+=fox.onP?2:fox.stink&&frame%2?0:1;
  const leg=Math.floor(fox.walk/5)%2;if(dir&&!fox.onP&&leg!==prevLeg)sfx.step();prevLeg=leg;
  if(fox.slip&&frame%18===0)sfx.slip();
  if(fox.chew>0)fox.chew--;
  if(fox.slip&&frame%4===0)parts.push({x:fox.x+8-Math.sign(fox.vx)*6,y:GROUND-1,vx:-fox.vx*.3,vy:-.4,life:10,c:PAL.t});

  const body=fox.big?{x:fox.x-2,y:GROUND-28,w:20,h:28}:{x:fox.x+3,y:GROUND-14,w:10,h:14};
  const mouthZ=fox.big?{x:fox.x-6,y:GROUND-36,w:28,h:18}:{x:fox.x+1,y:GROUND-18,w:14,h:9};

  for(const it of items){
    it.t++;
    if(it.type==='heart'){
      if(it.state==='fall'){it.y+=1;it.x=it.bx+Math.sin(it.t/12)*3;if(it.y+8>=GROUND){it.dead=true;burst(it.x+4,GROUND-2,8,[PAL.r,PAL.p,PAL.t],1.2,1.4);sfx.heartLost();continue;}}
      if(hit(it,9,8,body)||hit(it,9,8,mouthZ)){it.dead=true;if(lives<5)losses.pop();lives=Math.min(5,lives+1);sfx.heart();
        burst(it.x+4,it.y+4,10,[PAL.r,PAL.t,PAL.p],1.4,1.6);}
      continue;
    }
    const eggish=it.type!=='ball',w=eggish?8:9,h=eggish?10:9;
    if(it.state==='fall'){
      it.vy=Math.min(it.vy+.025,it.vmax||L.vmax);it.y+=it.vy;
      it.x=clamp(it.x+windAt(wt),0,W-w); // vento (mesma conta de landX)
      if(it.type==='egg'){
        if(it.hatch&&!bird&&rainT===0&&it.y+h>=GROUND-34&&Math.abs(it.x+4-(fox.x+8))<16){hatchEgg(it);continue;}
        if(it.gold&&fox.mouth&&hit(it,w,h,mouthZ)){eatGold(it);continue;}
        if(fox.mouth&&hit(it,w,h,mouthZ)){
          it.dead=true;score++;combo++;fox.chew=16;eaten.push(it.rain?it.col:-1);sfx.eat(combo);if(score%10===0)sfx.levelup();
          burst(fox.x+8,GROUND-16,6,[PAL.y,PAL.t,PAL.w],1.2,1.6);continue;
        }else if(hit(it,w,h,body)){
          it.state='bonk';it.vy=-1.8;it.vx=(it.x+4<fox.x+8?-1:1)*.9;sfx.tock();
        }
      }else if(it.type==='rotten'){
        if(fox.big&&(hit(it,w,h,body)||hit(it,w,h,mouthZ))){ // gigante: o ovo podre se desfaz sem vomito e sem cheiro
          it.dead=true;sfx.smash();burst(it.x+4,it.y+5,8,['#a3ad5e','#6f7a34',PAL.y],1.5,1.5);continue;}
        if(fox.mouth&&hit(it,w,h,mouthZ)){eatRotten(it);continue;}
        else if(VB&&hit(it,w,h,body)){splatRotten(it);continue;}
        else if(hit(it,w,h,body)){it.state='bonk';it.vy=-1.8;it.vx=(it.x+4<fox.x+8?-1:1)*.9;sfx.tock();}
      }else if(fox.big&&hit(it,w,h,body)){smashAway(it);
      }else if(hit(it,w,h,body)){
        if(fox.stun===0&&fox.inv===0){
          fox.stun=60;shake=7;sfx.bonk();fox.vx*=fox.onP?1:0;
          burst(fox.x+8,GROUND-14,5,[PAL.y,PAL.t],1.4,1.4);
        }
        it.state='bounce';it.t=0;it.b=1;it.vy=-2.2;it.vx=(it.x+4.5<fox.x+8?-1:1)*1.2;
      }
      if(it.state==='fall'&&it.y+h>=GROUND){
        if(it.type==='egg')breakEgg(it);
        else if(it.type==='rotten')breakRotten(it);
        else{it.y=GROUND-h;it.state='bounce';it.t=0;it.vy=-Math.abs(it.vy)*.6;
          it.vx=(Math.random()<.5?-1:1)*(.5+Math.random()*.5);it.b=0;sfx.bounce(0);}
      }
    }else{
      it.vy+=.12;it.y+=it.vy;it.x+=it.vx+windAt(wt)*.5;
      if(it.y+h>=GROUND){
        if(it.type==='egg'){breakEgg(it);continue;}
        if(it.type==='rotten'){breakRotten(it);continue;}
        it.y=GROUND-h;
        if(Math.abs(it.vy)<.9)it.vy=0;else{it.vy=-Math.abs(it.vy)*.55;it.b=(it.b||0)+1;sfx.bounce(Math.min(it.b,4));}
      }
      if(it.type==='ball'&&(it.t>150||it.x<-12||it.x>W+4))it.dead=true;
    }
  }
  items=items.filter(i=>!i.dead);
  for(const p of puddles)p.life--;
  puddles=puddles.filter(p=>p.life>0);
  for(const z of stinks)z.life--;
  stinks=stinks.filter(z=>z.life>0);
}

const MEDALS=[[100,'PLATINA','#e4f2f8','#9fb8c4'],[50,'OURO','#f4c430','#b8861a'],[25,'PRATA','#d4d8dc','#8c949a'],[10,'BRONZE','#d68c4c','#8f5528']];
function disc(cx,cy,r,c){ctx.fillStyle=c;for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.8)ctx.fillRect(cx+x,cy+y,1,1);}

  disc(cx,cy,7,PAL.k);disc(cx,cy,6,m[3]);disc(cx,cy,5,m[2]);

      text('CHUVA',W/2,42,2,frame%16<8?PAL.y:PAL.t,'center',PAL.k);

  if(state==='pause'){

    ctx.drawImage(FARMER.angry,FARMER_X,LEDGE_Y-11); // o fazendeiro acordou de vez (fica claro, por cima do escuro)

    text('ACORDOU!',W/2,47,2,PAL.r,'center',PAL.k);
    text('OVOS '+score,W/2,64,2,PAL.t,'center',PAL.k);
    const m=MEDALS.find(m=>score>=m[0]);
    if(m){drawMedal(W/2,88,m);text(m[1],W/2,100,1,m[2],'center',PAL.k);}
    else text('SEM MEDALHA',W/2,86,1,PAL.g,'center',PAL.k);
    const nx=[...MEDALS].reverse().find(m=>score<m[0]);
    if(nx)text(nx[1]+' COM '+nx[0],W/2,111,1,PAL.w);
    text(newBest?'NOVO RECORDE!':'RECORDE '+best,W/2,122,1,PAL.y);
    if(overT>25&&Math.floor(frame/30)%2)text('TOQUE PARA JOGAR',W/2,142,1,PAL.t);
    // botao: ver a piramide de ovos
    ctx.fillStyle=PAL.k;ctx.fillRect(PB.x-1,PB.y-1,PB.w+2,PB.h+2);
    ctx.fillStyle='#ebe6dc';ctx.fillRect(PB.x,PB.y,PB.w,PB.h);
    ctx.fillStyle='#8a6670';ctx.fillRect(PB.x,PB.y+PB.h-2,PB.w,2);

  }
}

const PB={x:W/2-40,y:151,w:80,h:14}; // botao PIRAMIDE na tela de fim de jogo

/* ---------- piramide de ovos ---------- */
// Pilha "bala de canhao": camadas quadradas b*b, (b-1)*(b-1)... e cada ovo de cima fica no vao entre 4 de baixo.
// A quantidade bate exatamente com os ovos comidos: as camadas de baixo sao completas e a do topo leva o resto.
const sqp=b=>b*(b+1)*(2*b+1)/6;
function pyramidCells(n){
  if(n<=0)return [];
  let b=1;while(sqp(b)<n)b++;
  let miss=sqp(b)-n,top=1;
  while(miss>=top*top){miss-=top*top;top++;} // tira camadas inteiras do topo
  const cells=[];
  for(let s=b;s>=top;s--){const L=b-s,c=(s-1)/2;let layer=[];
    for(let i=0;i<s;i++)for(let j=0;j<s;j++)layer.push({i,j,L,d:(i-c)**2+(j-c)**2,a:Math.atan2(j-c,i-c)});
    if(s===top&&miss){layer.sort((p,q)=>p.d-q.d||p.a-q.a);layer=layer.slice(0,s*s-miss);} // topo parcial, centralizado
    for(const e of layer){const wx=e.i+L/2,wy=e.j+L/2;cells.push({L,k:wx+wy,x:Math.round((wx-wy)*6),y:Math.round((wx+wy)*3-L*7)});}
  }
  return cells.sort((p,q)=>p.L-q.L||p.k-q.k); // desenha de tras para frente, de baixo para cima
}
function drawPyramid(list,chicks){
  const n=list.length,cells=pyramidCells(n);
  // cores embaralhadas (sempre igual para a mesma partida)
  let z=n*7919+13;const rnd=()=>(z=(z*16807)%2147483647)/2147483647;
  const cols=[...list];for(let i=cols.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[cols[i],cols[j]]=[cols[j],cols[i]];}
  let minX=-8,maxX=8,minY=-15,maxY=0,fx=0,fy=0;
  if(n){const topL=cells[cells.length-1].L,tops=cells.filter(c=>c.L===topL);
    fx=Math.round(tops.reduce((a,c)=>a+c.x,0)/tops.length);fy=Math.min(...tops.map(c=>c.y))-10+2;
    minX=Math.min(...cells.map(c=>c.x))-4;maxX=Math.max(...cells.map(c=>c.x))+4;maxY=Math.max(...cells.map(c=>c.y));minY=fy-15;}
  const nc=Math.min(chicks,12),HEAD=44,FOOT=nc?44:24;
  const PW=Math.max(124,Math.ceil((maxX-minX+30)/2)*2);
  const PH=Math.max(Math.round(PW*1.25),HEAD+(maxY-minY)+FOOT+10);
  const ox=Math.round(PW/2-(minX+maxX)/2),oy=PH-FOOT-maxY;
  const c=document.createElement('canvas');c.width=PW;c.height=PH;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const P=TIMES[0],gy=n?oy+Math.min(...cells.filter(e=>e.L===0).map(e=>e.y))-3:oy-4;
  // ceu, sol e colinas
  g.fillStyle=P.sky;g.fillRect(0,0,PW,PH);
  g.fillStyle=P.b1;g.fillRect(0,gy-34,PW,34);g.fillStyle=P.b2;g.fillRect(0,gy-16,PW,16);
  g.drawImage(SUN,PW-30,Math.max(HEAD-2,Math.min(HEAD+10,gy-62)));
  for(let x=0;x<PW;x++){const h1=Math.round(18+8*Math.sin(x/13)+5*Math.sin(x/5.3+1));g.fillStyle=P.h1;g.fillRect(x,gy-h1-8,1,h1+8);
    const h2=Math.round(10+5*Math.sin(x/9+2)+3*Math.sin(x/4.1));g.fillStyle=P.h2;g.fillRect(x,gy-h2,1,h2);}
  g.fillStyle=P.gr;g.fillRect(0,gy,PW,PH-gy);g.fillStyle=P.gt;g.fillRect(0,gy,PW,1);
  g.fillStyle=P.dirt;g.fillRect(0,PH-FOOT+6,PW,FOOT);g.fillStyle=P.gr;g.fillRect(0,PH-FOOT+6,PW,1);
  g.fillStyle=P.dot;for(let i=0;i<PW/3;i++)g.fillRect((i*37)%PW,PH-FOOT+9+((i*13)%(FOOT-10)),2,1);
  // sombra da piramide
  if(n){g.fillStyle='rgba(30,60,30,.25)';for(const e of cells)if(e.L===0)g.fillRect(ox+e.x-5,oy+e.y-2,10,3);}
  // ovos
  cells.forEach((e,i)=>g.drawImage(cols[i]>=0?RAIN_EGGS[cols[i]]:cols[i]===-2?GOLD:EGG,ox+e.x-4,oy+e.y-10));
  // raposa no topo, sorrindo
  g.drawImage(FOX.s0[0],ox+fx-8,n?oy+fy-15:oy-15);
  // pintinhos (ovos que chocaram em vez de serem comidos)
  for(let i=0;i<nc;i++)g.drawImage(CHICK[i%3===1?1:0][i%2],Math.round(PW/2-(nc*11-3)/2+i*11),PH-FOOT+2);
  // textos
  TX=g;const say=(t,x,y,sc,col)=>{text(t,x+1,y+1,sc,PAL.k);text(t,x,y,sc,col);}; // sombra de 1 pixel, legivel em qualquer escala
  say('A RAPOSA COMEU',PW/2,8,1,PAL.t);
  say(n+(n===1?' OVO':' OVOS'),PW/2,18,3,PAL.y);
  if(nc)say('+'+chicks+(chicks===1?' VIROU PINTINHO':' VIRARAM PINTINHO'),PW/2,PH-FOOT+14,1,PAL.t);
  say('EGG SPLASH',PW/2,PH-11,1,PAL.w);
  TX=null;
  // versao grande para exportar (pixels inteiros, ~1080 px de largura)
  const k=Math.max(1,Math.ceil(1080/PW)),out=document.createElement('canvas');out.width=PW*k;out.height=PH*k;
  const o=out.getContext('2d');o.imageSmoothingEnabled=false;o.drawImage(c,0,0,out.width,out.height);
  return out;
}
const pyrEl=document.getElementById('pyr'),pyrImg=document.getElementById('pyrimg');
let pyrBlob=null,pyrName='';
const pyrOpen=()=>!pyrEl.hidden;
function openPyr(){
  const out=drawPyramid(eaten,hatched);
  pyrImg.src=out.toDataURL('image/png');pyrBlob=null;pyrName='egg-splash-'+eaten.length+'-ovos.png';
  out.toBlob(b=>{pyrBlob=b;},'image/png'); // pronto antes do toque em SALVAR (o compartilhar do iOS exige o gesto)
  pyrEl.hidden=false;sfx.levelup();
}
function closePyr(){pyrEl.hidden=true;}
function savePyr(){
  if(!pyrBlob)return;
  const file=new File([pyrBlob],pyrName,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Egg Splash'}).catch(()=>{});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(pyrBlob);a.download=pyrName;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
document.getElementById('pyrsave').addEventListener('click',e=>{e.stopPropagation();savePyr();});
document.getElementById('pyrclose').addEventListener('click',e=>{e.stopPropagation();closePyr();});
pyrEl.addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- loop ---------- */
let last=performance.now(),acc=0,speed=1;
try{speed=localStorage.getItem('eggsplash-speed')==='2'?2:1}catch(e){}
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){for(let i=0;i<speed;i++)update();acc-=1000/60;}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

const SND_SVG=m=>'<svg viewBox="0 0 11 11" shape-rendering="crispEdges"><polygon points="0,3 3,3 6,0 7,0 7,11 6,11 3,8 0,8" fill="#1b1b1f"/><polygon points="1,4 3.5,4 6,1.5 6,9.5 3.5,7 1,7" fill="#ebe6dc"/>'+
  (m?'<rect x="8" y="3" width="1" height="1" fill="#1b1b1f"/><rect x="10" y="3" width="1" height="1" fill="#1b1b1f"/><rect x="9" y="4" width="1" height="2" fill="#1b1b1f"/><rect x="8" y="6" width="1" height="1" fill="#1b1b1f"/><rect x="10" y="6" width="1" height="1" fill="#1b1b1f"/>'
   :'<rect x="8" y="4" width="1" height="3" fill="#1b1b1f"/><rect x="9.5" y="2" width="1" height="7" fill="#1b1b1f"/>')+'</svg>';
/* ---------- input ---------- */
function act(){
  unlockAudio();
  if(pyrOpen())return;
  if(state==='title')reset();
  else if(state==='over'&&overT>25)reset();
  else if(state==='pause'){state='play';sfx.resume();}
}
const KEYMAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'m',KeyW:'m',Space:'m'};
addEventListener('keydown',e=>{
  if(pyrOpen()){if(e.code==='Escape'||e.code==='KeyV'||e.code==='Enter')closePyr();return;}
  if(e.code==='KeyV'&&state==='over'){openPyr();return;}
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play'){state='pause';sfx.pause();}else if(state==='pause'){state='play';sfx.resume();}return;}
  if(e.code==='KeyM'){toggleMute();return;}
  if(e.code==='KeyX'){toggleSpeed();return;}
  const k=KEYMAP[e.code];if(k){keys[k]=true;e.preventDefault();}
  if(!e.repeat&&(k||e.code==='Enter'))act();
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)keys[k]=false;});
function bind(id,k){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
    touch[k]=true;el.classList.add('on');act();});
  const off=()=>{touch[k]=false;el.classList.remove('on');};
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,off));
}
bind('bl','l');bind('br','r');bind('bm','m');
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='over'){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left-cv.clientLeft)/cv.clientWidth*W,y=(e.clientY-r.top-cv.clientTop)/cv.clientHeight*H;
    if(x>=PB.x-3&&x<=PB.x+PB.w+3&&y>=PB.y-3&&y<=PB.y+PB.h+3){unlockAudio();openPyr();return;}}
  act();});
document.getElementById('pause').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();
  unlockAudio();if(state==='play'){state='pause';sfx.pause();}else if(state==='pause'){state='play';sfx.resume();}});
const sndBtn=document.getElementById('snd');
function drawSnd(){sndBtn.innerHTML=SND_SVG(muted);sndBtn.setAttribute('aria-label',muted?'Ligar som':'Desligar som');}
function toggleMute(){unlockAudio();setMuted(!muted);drawSnd();if(!muted)tone(880,0,.06,'square',.05);}
sndBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();toggleMute();});drawSnd();
// botao de velocidade 1x / 2x (o jogo todo roda 2 passos por frame: raposa, objetos, timers e ceu)
const spdBtn=document.getElementById('spd');
const GLYPH={'1':['.#.','##.','.#.','.#.','###'],'2':['##.','..#','.#.','#..','###'],'X':['#.#','#.#','.#.','#.#','#.#']};
function SPD_SVG(fast){const t=fast?'2X':'1X';let r='';
  [...t].forEach((ch,n)=>GLYPH[ch].forEach((row,y)=>[...row].forEach((c,x)=>{if(c==='#')r+=`<rect x="${3+n*4+x}" y="${2+y}" width="1" height="1" fill="#1b1b1f"/>`;})));
  return '<svg viewBox="0 0 13 11" shape-rendering="crispEdges"><rect x="0" y="0" width="13" height="11" fill="#1b1b1f"/>'+
    `<rect x="1" y="1" width="11" height="7" fill="${fast?'#f4c430':'#ebe6dc'}"/><rect x="1" y="8" width="11" height="2" fill="${fast?'#b0821a':'#8a6670'}"/>`+r+'</svg>';}
function drawSpd(){spdBtn.innerHTML=SPD_SVG(speed===2);spdBtn.setAttribute('aria-label',speed===2?'Velocidade normal':'Velocidade 2x');spdBtn.setAttribute('aria-pressed',speed===2);}
function toggleSpeed(){unlockAudio();speed=speed===2?1:2;try{localStorage.setItem('eggsplash-speed',speed)}catch(e){}
  drawSpd();tone(speed===2?988:660,0,.05,'square',.04);if(speed===2)tone(1319,0,.05,'square',.04,.06);}
spdBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();toggleSpeed();});drawSpd();
['touchend','click'].forEach(t=>addEventListener(t,()=>unlockAudio(),{passive:true}));
addEventListener('contextmenu',e=>{if(!pyrOpen())e.preventDefault();}); // na piramide, segurar a imagem salva no iPhone
// iPhone: cancelar pointerdown nao bloqueia os gestos nativos de toque. Segurar um botao abria a lupa de texto
// (selecao por toque longo). Cancelar o touchstart (nao-passivo) nos controles e no canvas impede isso.
// A piramide fica de fora para os botoes dela e o "segurar para salvar a imagem" continuarem funcionando.
['controls','top','stage'].forEach(id=>document.getElementById(id).addEventListener('touchstart',e=>{if(!pyrOpen()&&e.cancelable)e.preventDefault();},{passive:false}));
addEventListener('selectstart',e=>{if(!pyrOpen())e.preventDefault();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause';});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in touch)touch[k]=false;});

/* ---------- fit ---------- */
function fit(){
  const st=document.getElementById('stage').getBoundingClientRect();
  const land=matchMedia('(orientation:landscape) and (min-aspect-ratio:5/4)').matches;
  let aw=st.width-28,ah=st.height-28;
  if(land)aw=st.width-2*Math.min(240,st.width*.28);
  const s=Math.max(1,Math.min((aw-12)/W,(ah-12)/H));
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
}
addEventListener('resize',fit);fit();setTimeout(fit,100);

window.__egg={reset,update,render,fox,keys,get items(){return items},get puddles(){return puddles},
  set score(v){score=v},set lives(v){lives=v},get lives(){return lives},get state(){return state},
  drop(type,x,y=-12){items.push({type,x,y,vx:0,vy:1,state:'fall',t:0})},
  icon(S){const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
    const u=Math.floor(S/24),o=Math.floor((S-24*u)/2);
    g.fillStyle='#9fd3e0';g.fillRect(0,0,S,S);
    g.fillStyle='#fbe9a6';g.fillRect(o+18*u,o+2*u,3*u,3*u);
    g.fillStyle='#7db37f';g.fillRect(0,o+18*u,S,2*u);g.fillStyle='#4f8a4f';g.fillRect(0,o+20*u,S,u);
    g.fillStyle='#8a5a3c';g.fillRect(0,o+21*u,S,S);
    g.drawImage(FOX.c0[0],o+4*u,o+6*u,16*u,15*u);g.drawImage(EGG,o+8*u,o-2*u+u,8*u*0.75|0,10*u*0.75|0);
    return c.toDataURL('image/png');},
  puddle(x){puddles.push({x,w:22,life:Infinity})},get score(){return score},get lvl(){return lvl},forceOver(){gameOver()},level,fallFrames,
  get bird(){return bird},dropGold(x,y=-12){items.push({type:'egg',gold:true,x,y,vx:0,vy:1,state:'fall',t:0})},set combo(v){combo=v},hatchAt(x){hatchEgg({x,y:GROUND-40})},
  setBird(o){bird=o},VB,get stinks(){return stinks},set eaten(v){eaten=v},get eaten(){return eaten},set hatched(v){hatched=v},openPyr,pyramidCells,drawPyramid};
})();

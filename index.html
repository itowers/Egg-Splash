<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Egg Splash">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6a96aa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Egg Splash</title>
<style>
:root{--bg:#6a96aa;--bg2:#6390a4;--ink:#1b1b1f;--btn:#ebe6dc;--btnsh:#8a6670}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
  background-image:repeating-conic-gradient(var(--bg) 0 25%,var(--bg2) 0 50%);background-size:40px 40px;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:6px solid var(--ink);
  box-shadow:10px 10px 0 rgba(0,0,0,.16);background:#9fd3e0}
#controls{height:118px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 8px}
.dpad{display:flex;gap:14px}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:none;outline:none}
button svg{display:block;width:100%;height:100%;pointer-events:none}
.arrow{width:60px;height:80px}
#br svg{transform:scaleX(-1)}
.mouth{width:88px;height:88px}
button.on svg{transform:translateY(4px)}
#br.on svg{transform:scaleX(-1) translateY(4px)}
/* barra do topo: ocupa uma faixa propria, entao os botoes nunca cobrem a tela do jogo */
#top{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 14px 0}
#top .right{display:flex;gap:12px}
#pause{width:36px;height:40px}
#snd{width:40px;height:40px}
#spd{width:48px;height:40px}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  #top{position:absolute;z-index:5;left:0;right:0;pointer-events:none;
    top:calc(env(safe-area-inset-top) + 8px);
    padding:0 calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px)}
  #top button{pointer-events:auto}
  #controls{position:absolute;left:0;right:0;height:auto;pointer-events:none;
    bottom:calc(env(safe-area-inset-bottom) + 24px);
    padding:0 calc(env(safe-area-inset-right) + 30px) 0 calc(env(safe-area-inset-left) + 30px)}
  #controls button{pointer-events:auto}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
  <button id="pause" aria-label="Pausar">
    <svg viewBox="0 0 10 11" shape-rendering="crispEdges"><rect x="0" y="0" width="4" height="11" fill="#1b1b1f"/><rect x="6" y="0" width="4" height="11" fill="#1b1b1f"/><rect x="1" y="1" width="2" height="7" fill="#ebe6dc"/><rect x="7" y="1" width="2" height="7" fill="#ebe6dc"/><rect x="1" y="8" width="2" height="2" fill="#8a6670"/><rect x="7" y="8" width="2" height="2" fill="#8a6670"/></svg>
  </button>
  <div class="right"><button id="spd"></button><button id="snd"></button></div>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="controls">
    <div class="dpad">
      <button id="bl" class="arrow" aria-label="Esquerda"><svg viewBox="0 0 18 24" shape-rendering="crispEdges"><polygon points="16,1 12,1 1,10.5 1,13.5 12,23 16,23" fill="#1b1b1f"/><polygon points="14,3 12,3 3.5,11 3.5,13 14,13" fill="#ebe6dc"/><polygon points="3.5,13 14,13 14,21 12.5,21" fill="#8a6670"/></svg></button>
      <button id="br" class="arrow" aria-label="Direita"><svg viewBox="0 0 18 24" shape-rendering="crispEdges"><polygon points="16,1 12,1 1,10.5 1,13.5 12,23 16,23" fill="#1b1b1f"/><polygon points="14,3 12,3 3.5,11 3.5,13 14,13" fill="#ebe6dc"/><polygon points="3.5,13 14,13 14,21 12.5,21" fill="#8a6670"/></svg></button>
    </div>
    <button id="bm" class="mouth" aria-label="Abrir a boca"><svg viewBox="0 0 24 24" shape-rendering="crispEdges"><circle cx="12" cy="12" r="11.5" fill="#1b1b1f"/><circle cx="12" cy="13" r="9.5" fill="#8a6670"/><circle cx="12" cy="11" r="9.5" fill="#ebe6dc"/><polygon points="7,13 9,7 12,11 15,7 17,13" fill="#e65a6e" stroke="#1b1b1f" stroke-width="1" stroke-linejoin="miter"/></svg></button>
  </div>
</div>
<script>
(()=>{
const W=144,H=192,GROUND=172;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;

/* ---------- palette & sprites ---------- */
const PAL={k:'#1b1b1f',o:'#e8792b',d:'#b0521f',w:'#f6ecd8',p:'#e65a6e',s:'#9b6a43',c:'#d6c19c',
  r:'#cf4630',y:'#f4c430',g:'#9a9a9a',t:'#ffffff'};
function bake(rows,flip,pal=PAL){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  rows.forEach((r,y)=>{r=r.padEnd(w,'.');for(let x=0;x<w;x++){const ch=r[x];if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(flip?w-1-x:x,y,1,1);}}});
  return c;
}
const HEAD=[
"..kk........kk..",
".kook......kook.",
".kopokkkkkkopok.",
"kooooooooooooook",
"kookkooooookkook",
"kooooooooooooook",
"kowwwwwkkwwwwwok",
".kwwwwwwwwwwwwk.",
"..kkwwwwwwwwkk..",
];
const HEAD_OPEN=[
".kk..........kk.",
".ktk........ktk.",
".kwtk......ktwk.",
"..kwwkppppkwwk..",
"..kwwwkppkwwwk..",
".kkowwwkkwwwokk.",
"kookoowwwwookook",
"koookkooookkoook",
".kooooooooooook.",
];
const BODY=[
"...kooowwoook.kk",
"..kooowwwwoookok",
"..kooowwwwoookwk",
"..kooooooooookk.",
];
const LEGS=[
["...kdk....kdk...","...kkk....kkk..."],
["....kdk..kdk....","....kkk..kkk...."],
["..kdk......kdk..","..kkk......kkk.."],
];
const FOX={};
for(const [name,head] of [['c',HEAD],['o',HEAD_OPEN]])
  LEGS.forEach((l,i)=>{const rows=[...head,...BODY,...l];FOX[name+i]=[bake(rows,false),bake(rows,true)];});

const EGG=bake([
"...kk...",
"..kwwk..",
".kwwwck.",
".kwswck.",
"kwwwwwck",
"kwswwwck",
"kwwwwsck",
"kwwwwwck",
".kwwwck.",
"..kkkk..",
]);
const BALL_ROWS=[[
"..kkkkk..",
".kwwwwwk.",
"kwwwwwwck",
"kwwwwwwck",
"krrrrrrrk",
"kwwwwwwck",
"kwwwwwwck",
".kwwwwck.",
"..kkkkk..",
],[
"..kkkkk..",
".kwwrwwk.",
"kwwwrwwck",
"kwwwrwwck",
"kwwwrwwck",
"kwwwrwwck",
"kwwwrwwck",
".kwwrwck.",
"..kkkkk..",
]];
// disfarce progressivo: fase 1 bola vermelha, fase 2 cor do ovo + listra vermelha, fase 3 listra sutil, fase 4 sem listra (so a forma)
const BALL_PALS=[{...PAL,w:'#e8604c',c:'#b03a2a',r:'#ffffff'},PAL,{...PAL,r:'#e2cfae'},{...PAL,r:PAL.w}];
const BALLS=BALL_PALS.map(p=>BALL_ROWS.map(r=>bake(r,false,p)));
const BALL=BALLS[1];
const HEART=bake([".kk.kk.","krrkrrk","krrrrrk",".krrrk.","..krk..","...k..."]);
const HEART0=bake([".kk.kk.","kggkggk","kgggggk",".kgggk.","..kgk..","...k..."]);
// colorful easter-style eggs for the egg rain: [shell, shade, pattern]
const EGG_COLS=[['#f7a1c4','#d9779f','#ffffff'],['#8ecdf5','#5e9ed0','#ffffff'],['#9be09a','#62b066','#fff6a8'],
  ['#ffe066','#d9b23a','#e65a6e'],['#c7a2f0','#9a74cf','#ffffff'],['#ffb36b','#d9853f','#ffffff']];
const RAIN_EGGS=EGG_COLS.map(c=>bake([
"...kk...",
"..kaak..",
".kaaabk.",
".kqqqbk.",
"kaaaaabk",
"kaqaqabk",
"kaaaaabk",
"kqqqqqbk",
".kaaabk.",
"..kkkk..",
],false,{...PAL,a:c[0],b:c[1],q:c[2]}));
const HEART_BIG=bake([".kk...kk.","krrk.krrk","krtrkrrrk","krrrrrrrk",".krrrrrk.","..krrrk..","...krk...","....k...."]);
const STAR=bake(["..y..",".yyy.","yyyyy",".yyy.","..y.."]);

/* ---------- pixel font 3x5 ---------- */
const F={A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",
F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",
K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",
P:"110101110100100",Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",
U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",
Z:"111001010100111","0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110",
"4":"101101111001001","5":"111100110001110","6":"011100110101010","7":"111001010010010","8":"010101010101010",
"9":"010101011001110","!":"010010010000010",".":"000000000000010",":":"000010000010000","-":"000000111000000",
"?":"110001010000010","=":"000111000111000"};
function text(s,x,y,sc=1,col=PAL.k,align='center',sh=null){
  s=String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
  const tw=s.length*4*sc-sc;
  let sx=align==='center'?Math.round(x-tw/2):align==='right'?x-tw:x;
  const draw=(ox,oy,c)=>{ctx.fillStyle=c;for(let n=0;n<s.length;n++){const g=F[s[n]];if(!g)continue;
    for(let i=0;i<15;i++)if(g[i]==='1')ctx.fillRect(sx+ox+n*4*sc+(i%3)*sc,y+oy+Math.floor(i/3)*sc,sc,sc);}};
  if(sh)draw(sc,sc,sh);
  draw(0,0,col);
}

/* ---------- background: ciclo dia/noite + clima ---------- */
// ordem do ciclo: dia -> por do sol -> noite -> amanhecer -> dia
const TIMES=[
 {sky:'#9fd3e0',b1:'#b3dde4',b2:'#c6e6e6',cl:'#eef7f5',h1:'#a8cfa2',h2:'#7db37f',gt:'#7cbf6a',gr:'#4f8a4f',dirt:'#8a5a3c',dot:'#6e4630'}, // dia
 {sky:'#f0a266',b1:'#f4b67a',b2:'#f8cb92',cl:'#fbe0c4',h1:'#b39a72',h2:'#8a7d55',gt:'#a5a35a',gr:'#5f6a3a',dirt:'#7a4e34',dot:'#5e3a26'}, // por do sol
 {sky:'#1c2547',b1:'#232e58',b2:'#2b376a',cl:'#3b4777',h1:'#2e4648',h2:'#223636',gt:'#3d5e45',gr:'#1f3a2c',dirt:'#4a3428',dot:'#36251c'}, // noite
 {sky:'#e7a9b9',b1:'#eebcc8',b2:'#f3cfd5',cl:'#fbe6ea',h1:'#9cb39a',h2:'#74967a',gt:'#86b874',gr:'#46784a',dirt:'#7e5238',dot:'#62402c'}, // amanhecer
];
const PHASE=45*60;        // 45 s por fase -> ciclo completo de 3 min
const FADE=.3,STEPS=8;    // transicao nos ultimos 30% da fase, em 8 degraus (visual 8-bit)
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return c;}
function makeSky(p){const c=mk(),g=c.getContext('2d');
  g.fillStyle=p.sky;g.fillRect(0,0,W,H);
  g.fillStyle=p.b1;g.fillRect(0,110,W,30);
  g.fillStyle=p.b2;g.fillRect(0,128,W,20);
  return c;}
function makeLand(p){const c=mk(),g=c.getContext('2d');
  for(let x=0;x<W;x++){
    const h1=Math.round(18+8*Math.sin(x/13)+5*Math.sin(x/5.3+1));
    g.fillStyle=p.h1;g.fillRect(x,GROUND-h1-8,1,h1+8);
    const h2=Math.round(10+5*Math.sin(x/9+2)+3*Math.sin(x/4.1));
    g.fillStyle=p.h2;g.fillRect(x,GROUND-h2,1,h2);
  }
  g.fillStyle=p.gr;g.fillRect(0,GROUND,W,4);
  g.fillStyle=p.gt;g.fillRect(0,GROUND,W,1);
  g.fillStyle=p.dirt;g.fillRect(0,GROUND+4,W,H-GROUND-4);
  g.fillStyle=p.dot;
  for(let i=0;i<40;i++){g.fillRect((i*37)%W,GROUND+6+((i*13)%(H-GROUND-8)),2,1);}
  return c;}
const SKIES=TIMES.map(makeSky),LANDS=TIMES.map(makeLand);
function orb(r,col,sh){const c=document.createElement('canvas');c.width=c.height=r*2+1;const g=c.getContext('2d');
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r){g.fillStyle=col;g.fillRect(x+r,y+r,1,1);}
  if(sh){g.fillStyle=sh;[[-2,-1,2],[2,2,1],[-1,3,1],[3,-3,1]].forEach(([x,y,w])=>g.fillRect(x+r,y+r,w,w));}
  return c;}
const SUN=orb(9,'#fbe9a6'),SUN_LOW=orb(9,'#f8c46c');
// lua crescente (nao pode parecer uma bola redonda e clara)
const MOON=(()=>{const c=orb(6,'#c9d4ee'),g=c.getContext('2d');g.globalCompositeOperation='destination-out';
  for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++)if((x-3)*(x-3)+(y+2)*(y+2)<=30)g.fillRect(x+6,y+6,1,1);return c;})();
const STARS=[];{let z=7;const rnd=()=>(z=(z*16807)%2147483647)/2147483647;
  for(let i=0;i<28;i++)STARS.push({x:Math.floor(rnd()*W),y:Math.floor(4+rnd()*100),b:rnd()<.25,ph:Math.floor(rnd()*60)});}
const CLOUDS=[{x:14,y:40,v:.05},{x:70,y:62,v:.035},{x:100,y:96,v:.025}];
let skyT=0;
// clima: chuva de verdade (aleatoria) + ceu fechando como aviso antes da Chuva de Ovos
const wx={raining:false,t:60*50,over:0};
let drops=[];
const q=(v,n=STEPS)=>Math.round(v*n)/n;
function cyc(){return (skyT/PHASE)%TIMES.length;}
function nightK(c){return c<1.7?0:c<2?(c-1.7)/.3:c<3?1:c<3.3?1-(c-3)/.3:0;}
function layer(arr,c){const i=Math.floor(c),k=c-i,f=q(Math.max(0,(k-(1-FADE))/FADE));
  ctx.drawImage(arr[i],0,0);
  if(f>0){ctx.globalAlpha=f;ctx.drawImage(arr[(i+1)%arr.length],0,0);ctx.globalAlpha=1;}}
function arc(u){return {x:Math.round(-10+u*(W+20)),y:Math.round(140-Math.sin(u*Math.PI)*92)};}
function drawWorld(){
  const c=cyc(),i=Math.floor(c),k=c-i,f=q(Math.max(0,(k-(1-FADE))/FADE)),ni=(i+1)%TIMES.length;
  layer(SKIES,c);
  // estrelas
  const n=q(nightK(c)*(1-wx.over));
  if(n>0){ctx.globalAlpha=n;ctx.fillStyle='#f4f1e0';
    for(const s of STARS){if(s.b&&Math.floor((frame+s.ph)/30)%4===0)continue;ctx.fillRect(s.x,s.y,1,1);}
    ctx.globalAlpha=1;}
  // sol: nasce no amanhecer, se poe no fim do por do sol
  const su=((c+1)%4)/3;
  if((c+1)%4<3){const p=arc(su);ctx.globalAlpha=q(1-wx.over*.85);ctx.drawImage(i===0?SUN:SUN_LOW,p.x-9,p.y-9);ctx.globalAlpha=1;}
  // lua
  if(c>=1.6&&c<3.4){const p=arc((c-1.6)/1.8);ctx.globalAlpha=q(1-wx.over*.85);ctx.drawImage(MOON,p.x-6,p.y-6);ctx.globalAlpha=1;}
  // nuvens (cor da fase atual, trocando no meio da transicao)
  const cl=f>=.5?TIMES[ni].cl:TIMES[i].cl;
  for(const o of CLOUDS){const x=Math.round(o.x),y=o.y;ctx.fillStyle=cl;
    ctx.fillRect(x,y,22,4);ctx.fillRect(x+4,y-3,12,3);ctx.fillRect(x+9,y-5,6,2);}
  layer(LANDS,c);
  // ceu fechado (chuva / aviso)
  const o=q(wx.over);
  if(o>0){ctx.fillStyle='rgba(58,66,84,'+(o*.45)+')';ctx.fillRect(0,0,W,GROUND+4);}
}
function updateWorld(){
  for(const o of CLOUDS){o.x+=o.v*(1+wx.over*3);if(o.x>W+2)o.x=-24;}
  let target=0;
  if(state==='play'){
    if(rainT>0){wx.raining=false;}
    else{
      if(--wx.t<=0){wx.raining=!wx.raining;wx.t=wx.raining?60*(12+Math.random()*8):60*(40+Math.random()*40);}
      const left=RAIN_EVERY-timerT;
      target=wx.raining?1:left<=180?1-left/180:0; // ceu fecha nos 3 s antes da Chuva de Ovos
    }
  }
  wx.over+=Math.sign(target-wx.over)*Math.min(Math.abs(target-wx.over),1/60);
  if(state==='play'&&wx.raining&&rainT===0)for(let j=0;j<2;j++)drops.push({x:Math.random()*(W+48),y:-4-Math.random()*20});
  const dc=nightK(cyc())>.5?'#8fa6c8':'#dceaf2';
  for(const d of drops){d.x-=1.2;d.y+=4.5;
    if(d.y>=GROUND){d.dead=true;if(Math.random()<.3)parts.push({x:d.x,y:GROUND-1,vx:(Math.random()-.5)*.6,vy:-.7,life:6,c:dc});}}
  drops=drops.filter(d=>!d.dead&&d.x>-4);
}
function drawDrops(){
  if(!drops.length)return;
  ctx.fillStyle=nightK(cyc())>.5?'rgba(143,166,200,.8)':'rgba(220,234,242,.75)';
  for(const d of drops){const x=Math.round(d.x),y=Math.round(d.y);ctx.fillRect(x,y,1,2);ctx.fillRect(x-1,y+2,1,2);}
}


/* ---------- audio ---------- */
let ac=null,master=null,noiseBuf=null,silentEl=null,muted=false;
try{muted=localStorage.getItem('eggsplash-mute')==='1'}catch(e){}
function silentWav(){const n=4410,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!ac){try{
    ac=new(window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=muted?0:.9;
    const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
    const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }catch(e){ac=null;return;}}
  if(ac.state!=='running')ac.resume().catch(()=>{});
  try{const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);}catch(e){}
  // iOS: an HTML audio element switches the session to "playback" so the silent switch doesn't mute the game
  if(!silentEl&&!navigator.audioSession){try{silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute('playsinline','');}catch(e){}}
  if(silentEl&&silentEl.paused)silentEl.play().catch(()=>{});
}
function setMuted(m){muted=m;try{localStorage.setItem('eggsplash-mute',m?'1':'0')}catch(e){}
  if(master)master.gain.setTargetAtTime(m?0:.9,ac.currentTime,.02);}
function tone(f1,f2,dur,type='square',vol=.07,delay=0){if(!ac||muted)return;try{
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);}catch(e){}}

/* ---------- state ---------- */
let state='title',score=0,best=0,lives=3,frame=0,overT=0,newBest=false;

const fox={x:W/2-8,vx:0,face:1,mouth:false,stun:0,inv:0,chew:0,walk:0,slip:false,onP:false};
const keys={l:false,r:false,m:false},touch={l:false,r:false,m:false};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function reset(){skyT=0;wx.raining=false;wx.t=60*(40+Math.random()*30);wx.over=0;drops=[];score=0;lives=5;heartsToDrop=0;heartPlan=[];combo=0;rainT=0;timerT=0;recent=[];spawned=0;ballRun=0;eggRun=0;lastBallPhase=-1;lastEgg={x:W/2-4,arr:frame+60};items=[];parts=[];puddles=[];spawnT=50;newBest=false;
  Object.assign(fox,{x:W/2-8,vx:0,stun:0,inv:0,chew:0,walk:0});state='play';sfx.start();}
// Curva de dificuldade (ver curva-de-dificuldade.md no projeto). s = ovos comidos.
// Sobe rapido no inicio e se aproxima de um teto justo: queda 3,0s -> 1,6s, intervalo 1,6s -> 0,7s, bolas 0% -> 50%.
const fallCache=new Map();
function vmaxFor(frames){ // velocidade maxima para um ovo levar ~frames do topo ate a raposa
  if(fallCache.has(frames))return fallCache.get(frames);
  let lo=.6,hi=6;for(let i=0;i<30;i++){const m=(lo+hi)/2;if(fallFrames(m,GROUND-26)>frames)lo=m;else hi=m;}
  fallCache.set(frames,hi);return hi;}
const phaseOf=s=>s<10?0:s<30?1:s<50?2:3;
function level(){const s=score,fall=Math.round(60*(1.6+1.4*Math.exp(-s/40)));

function fallFrames(vmax,target){let y=-12,vy=.5,n=0;while(y<target&&n<900){vy=Math.min(vy+.025,vmax);y+=vy;n++;}return n;}
// every drop is placed so it is always possible: eggs reachable from the previous egg, balls never on top of an egg
// returns frames until the next spawn attempt
function spawn(){
  const L=level();
  const falling=items.filter(i=>!i.rain&&i.type!=='heart'&&i.state==='fall').length;
  if(falling>=L.maxOn)return 6;
  let type=spawned<3?'egg':Math.random()<L.ballP?'ball':'egg'; // os 3 primeiros sao sempre ovos
  if(type==='ball'&&ballRun>=3)type='egg';                       // no maximo 3 bolas seguidas
  if(type==='egg'&&spawned>=3&&score>=20&&eggRun>=6)type='ball'; // depois de 20, no maximo 6 ovos seguidos
  if(spawned>=4&&L.phase>lastBallPhase)type='ball';            // cada fase apresenta sua bola logo no inicio
  const intro=type==='ball'&&L.phase>lastBallPhase;              // primeira bola de cada fase de disfarce:
  if(intro&&falling>0)return 6;                                  // cai sozinha...
  const fall=intro?Math.round(L.fall*1.3):L.fall,vmax=intro?vmaxFor(fall):L.vmax; // ...e 30% mais devagar
  const arr=frame+fallFrames(vmax,type==='egg'?GROUND-26:GROUND-23);
  recent=recent.filter(r=>r.arr>frame-20);
  let x=0,ok=false;
  for(let i=0;i<24&&!ok;i++){
    if(type==='egg'){
      const reach=Math.max(8,1.2*(arr-lastEgg.arr));
      x=clamp(lastEgg.x+(Math.random()*2-1)*reach,4,W-12);
      ok=!recent.some(r=>r.type==='ball'&&Math.abs(r.arr-arr)<32&&Math.abs(r.x-x)<20);
    }else{
      x=4+Math.random()*(W-17);
      ok=!recent.some(r=>r.type==='egg'&&Math.abs(r.arr-arr)<32&&Math.abs(r.x-x)<22);
    }
  }
  if(!ok)return L.interval;
  if(type==='egg'){lastEgg={x,arr};eggRun++;ballRun=0;}
  else{ballRun++;eggRun=0;lastBallPhase=L.phase;}

function spawnRain(){items.push({type:'egg',x:4+Math.random()*(W-12),y:-12,vx:0,vy:.5+Math.random()*.8,state:'fall',t:0,rain:true,col:Math.floor(Math.random()*EGG_COLS.length)});}
// lost hearts come back during the rain, dropped on the side farthest from the fox
function spawnHeart(bx){items.push({type:'heart',x:bx,bx,y:-10,vx:0,vy:0,state:'fall',t:0});}
// lost hearts come back during the rain, spread over the whole rain and across the whole screen (shuffled lanes)
function planHearts(n){
  const lanes=[...Array(n)].map((_,i)=>Math.round(8+(n>1?i*(W-25)/(n-1):(W-25)/2)));
  for(let i=lanes.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[lanes[i],lanes[j]]=[lanes[j],lanes[i]];}
  const span=RAIN_LEN-100;

function startRain(){
  rainT=RAIN_LEN;heartsToDrop=5-lives;heartPlan=planHearts(heartsToDrop);sfx.rain();

function update(){

  if(state!=='play')return;
  if(shake>0)shake--;

  if(rainT>0){
    rainT--;if(frame%6===0)spawnRain();
    {const k=RAIN_LEN-rainT;while(heartPlan.length&&k>=heartPlan[0].k){spawnHeart(heartPlan.shift().x);heartsToDrop--;}}

      for(const it of items)if(it.rain){it.dead=true;burst(it.x+4,it.y+5,4,[PAL.t,PAL.y],1,1);}

    ctx.fillStyle=rainT>0?(frame%10<5?PAL.y:PAL.t):(low&&frame%20<10?PAL.t:PAL.y);
    ctx.fillRect(bx,by,Math.ceil(bw*f),5);
    ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillRect(bx,by,Math.ceil(bw*f),1);
    ctx.drawImage(EGG,bx+bw+3,by-3);
    const secs=Math.ceil((rainT>0?rainT:RAIN_EVERY-timerT)/60);
    text(secs,bx+bw/2,by+8,1,PAL.t,'center',PAL.k);
    if(rainT>0){
      if(rainT>RAIN_LEN-20){ctx.fillStyle='rgba(255,236,160,'+((rainT-(RAIN_LEN-20))/40)+')';ctx.fillRect(0,0,W,H);}
      text('CHUVA',W/2,30,2,frame%16<8?PAL.y:PAL.t,'center',PAL.k);
      text('DE OVOS!',W/2,43,2,frame%16<8?PAL.y:PAL.t,'center',PAL.k);
    }
  }
  if(state==='pause'){
    ctx.fillStyle='rgba(27,27,31,.55)';ctx.fillRect(0,0,W,H);
    text('PAUSA',W/2,76,3,PAL.t,'center',PAL.k);
    text('TOQUE PARA CONTINUAR',W/2,104,1,PAL.t);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(27,27,31,.6)';ctx.fillRect(0,0,W,H);
    text('FIM DE JOGO',W/2,34,2,PAL.r,'center',PAL.k);
    text('OVOS '+score,W/2,54,2,PAL.t,'center',PAL.k);
    const m=MEDALS.find(m=>score>=m[0]);
    if(m){drawMedal(W/2,88,m);text(m[1],W/2,100,1,m[2],'center',PAL.k);}
    else text('SEM MEDALHA',W/2,86,1,PAL.g,'center',PAL.k);
    const nx=[...MEDALS].reverse().find(m=>score<m[0]);
    if(nx)text(nx[1]+' COM '+nx[0],W/2,111,1,PAL.w);
    text(newBest?'NOVO RECORDE!':'RECORDE '+best,W/2,122,1,PAL.y);
    if(overT>25&&Math.floor(frame/30)%2)text('TOQUE PARA JOGAR',W/2,142,1,PAL.t);
  }
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0,speed=1;
try{speed=localStorage.getItem('eggsplash-speed')==='2'?2:1}catch(e){}
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){for(let i=0;i<speed;i++)update();acc-=1000/60;}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

const SND_SVG=m=>'<svg viewBox="0 0 11 11" shape-rendering="crispEdges"><polygon points="0,3 3,3 6,0 7,0 7,11 6,11 3,8 0,8" fill="#1b1b1f"/><polygon points="1,4 3.5,4 6,1.5 6,9.5 3.5,7 1,7" fill="#ebe6dc"/>'+
  (m?'<rect x="8" y="3" width="1" height="1" fill="#1b1b1f"/><rect x="10" y="3" width="1" height="1" fill="#1b1b1f"/><rect x="9" y="4" width="1" height="2" fill="#1b1b1f"/><rect x="8" y="6" width="1" height="1" fill="#1b1b1f"/><rect x="10" y="6" width="1" height="1" fill="#1b1b1f"/>'
   :'<rect x="8" y="4" width="1" height="3" fill="#1b1b1f"/><rect x="9.5" y="2" width="1" height="7" fill="#1b1b1f"/>')+'</svg>';
/* ---------- input ---------- */
function act(){
  unlockAudio();
  if(state==='title')reset();
  else if(state==='over'&&overT>25)reset();
  else if(state==='pause'){state='play';sfx.resume();}
}
const KEYMAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'m',KeyW:'m',Space:'m'};
addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play'){state='pause';sfx.pause();}else if(state==='pause'){state='play';sfx.resume();}return;}
  if(e.code==='KeyM'){toggleMute();return;}
  if(e.code==='KeyX'){toggleSpeed();return;}
  const k=KEYMAP[e.code];if(k){keys[k]=true;e.preventDefault();}
  if(!e.repeat&&(k||e.code==='Enter'))act();
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)keys[k]=false;});
function bind(id,k){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
    touch[k]=true;el.classList.add('on');act();});
  const off=()=>{touch[k]=false;el.classList.remove('on');};
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,off));
}
bind('bl','l');bind('br','r');bind('bm','m');
cv.addEventListener('pointerdown',e=>{e.preventDefault();act();});
document.getElementById('pause').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();
  unlockAudio();if(state==='play'){state='pause';sfx.pause();}else if(state==='pause'){state='play';sfx.resume();}});
const sndBtn=document.getElementById('snd');
function drawSnd(){sndBtn.innerHTML=SND_SVG(muted);sndBtn.setAttribute('aria-label',muted?'Ligar som':'Desligar som');}
function toggleMute(){unlockAudio();setMuted(!muted);drawSnd();if(!muted)tone(880,0,.06,'square',.05);}
sndBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();toggleMute();});drawSnd();
// botao de velocidade 1x / 2x (o jogo todo roda 2 passos por frame: raposa, objetos, timers e ceu)
const spdBtn=document.getElementById('spd');
const GLYPH={'1':['.#.','##.','.#.','.#.','###'],'2':['##.','..#','.#.','#..','###'],'X':['#.#','#.#','.#.','#.#','#.#']};
function SPD_SVG(fast){const t=fast?'2X':'1X';let r='';
  [...t].forEach((ch,n)=>GLYPH[ch].forEach((row,y)=>[...row].forEach((c,x)=>{if(c==='#')r+=`<rect x="${3+n*4+x}" y="${2+y}" width="1" height="1" fill="#1b1b1f"/>`;})));
  return '<svg viewBox="0 0 13 11" shape-rendering="crispEdges"><rect x="0" y="0" width="13" height="11" fill="#1b1b1f"/>'+
    `<rect x="1" y="1" width="11" height="7" fill="${fast?'#f4c430':'#ebe6dc'}"/><rect x="1" y="8" width="11" height="2" fill="${fast?'#b0821a':'#8a6670'}"/>`+r+'</svg>';}
function drawSpd(){spdBtn.innerHTML=SPD_SVG(speed===2);spdBtn.setAttribute('aria-label',speed===2?'Velocidade normal':'Velocidade 2x');spdBtn.setAttribute('aria-pressed',speed===2);}
function toggleSpeed(){unlockAudio();speed=speed===2?1:2;try{localStorage.setItem('eggsplash-speed',speed)}catch(e){}
  drawSpd();tone(speed===2?988:660,0,.05,'square',.04);if(speed===2)tone(1319,0,.05,'square',.04,.06);}
spdBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();toggleSpeed();});drawSpd();
['touchend','click'].forEach(t=>addEventListener(t,()=>unlockAudio(),{passive:true}));
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause';});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in touch)touch[k]=false;});

/* ---------- fit ---------- */
function fit(){
  const st=document.getElementById('stage').getBoundingClientRect();
  const land=matchMedia('(orientation:landscape) and (min-aspect-ratio:5/4)').matches;
  let aw=st.width-28,ah=st.height-28;
  if(land)aw=st.width-2*Math.min(240,st.width*.28);
  const s=Math.max(1,Math.min((aw-12)/W,(ah-12)/H));
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
}
addEventListener('resize',fit);fit();setTimeout(fit,100);

window.__egg={reset,update,render,fox,keys,get items(){return items},get puddles(){return puddles},
  set score(v){score=v},set lives(v){lives=v},get lives(){return lives},get state(){return state},
  drop(type,x,y=-12){items.push({type,x,y,vx:0,vy:1,state:'fall',t:0})},
  icon(S){const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
    const u=Math.floor(S/24),o=Math.floor((S-24*u)/2);
    g.fillStyle='#9fd3e0';g.fillRect(0,0,S,S);
    g.fillStyle='#fbe9a6';g.fillRect(o+18*u,o+2*u,3*u,3*u);
    g.fillStyle='#7db37f';g.fillRect(0,o+18*u,S,2*u);g.fillStyle='#4f8a4f';g.fillRect(0,o+20*u,S,u);
    g.fillStyle='#8a5a3c';g.fillRect(0,o+21*u,S,S);
    g.drawImage(FOX.c0[0],o+4*u,o+6*u,16*u,15*u);g.drawImage(EGG,o+8*u,o-2*u+u,8*u*0.75|0,10*u*0.75|0);
    return c.toDataURL('image/png');},
  puddle(x){puddles.push({x,w:22,life:Infinity})},get score(){return score},forceOver(){gameOver()},level,fallFrames};
})();

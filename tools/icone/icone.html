<!DOCTYPE html><html><body>
<!-- Icones do Egg Splash: abra com o Chrome (com --allow-file-access-from-files) ou por um servidor local na raiz do repositorio. Usa o LOGO e a raposa do proprio jogo (window.__egg). -->
<iframe id="f" src="../../index.html" width="390" height="844" style="display:none"></iframe>
<pre id="out"></pre>
<script>
f.onload=()=>setTimeout(()=>{try{
  const {LOGO,FOX}=f.contentWindow.__egg;
  function icon(N,sc,out){
    const c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
    const cx=N/2,gy=Math.round(N/2+66); // chao
    const cy=gy-40;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const a=Math.atan2(y-cy,x-cx),r=Math.hypot(x-cx,y-cy);
      const ray=Math.floor((a+Math.PI)/(Math.PI*2)*18)%2;
      g.fillStyle=r<26?(ray?'#d4f0f4':'#c2e8ee'):(ray?'#9fd3e0':'#84c0d2');g.fillRect(x,y,1,1);}
    g.fillStyle='#7cbf6a';g.fillRect(0,gy,N,2);g.fillStyle='#4f8a4f';g.fillRect(0,gy+2,N,2);g.fillStyle='#8a5a3c';g.fillRect(0,gy+4,N,N);
    g.fillStyle='#6e4630';for(let x=(N%7);x<N;x+=9)g.fillRect(x,gy+8+(x*7)%9,2,1);
    const fx=FOX['o0'][0];g.drawImage(fx,Math.round(cx-fx.width),gy-fx.height*2+2,fx.width*2,fx.height*2);
    const lg=LOGO.build(3),x=Math.round((N-lg.w)/2),y=Math.round(N/2-80);
    g.drawImage(lg.egg.cv,x+lg.ex,y);g.drawImage(lg.spl.cv,x+lg.sx,y+lg.sy);
    LOGO.drips(g,lg,x,y,0,true);
    // gota caindo na boca da raposa
    const dx=Math.round(cx)-1,dy=gy-38;g.fillStyle='#1b1b1f';g.fillRect(dx-1,dy-1,5,5);g.fillRect(dx,dy-2,3,7);
    g.fillStyle='#ef8414';g.fillRect(dx,dy-1,3,4);g.fillRect(dx+1,dy-2,1,1);g.fillStyle='#fff2a8';g.fillRect(dx,dy,1,1);
    const big=document.createElement('canvas');big.width=big.height=out;const b=big.getContext('2d');b.imageSmoothingEnabled=false;
    b.drawImage(c,Math.floor((out-N*sc)/2),Math.floor((out-N*sc)/2),N*sc,N*sc);return big.toDataURL();
  }
  // gera os 3 icones do jogo; clique para baixar e troque os arquivos na raiz do repositorio
  [[171,3,512,'icon-512.png'],[192,1,192,'icon-192.png'],[180,1,180,'apple-touch-icon.png']].forEach(([n,sc,o,name])=>{
    const u=icon(n,sc,o),a=document.createElement('a');a.href=u;a.download=name;a.innerHTML='<img src="'+u+'" style="image-rendering:pixelated;margin:8px"><br>'+name;
    a.style.cssText='display:inline-block;font:14px monospace;text-align:center';document.body.appendChild(a);out.textContent+=u+'\n';});
}catch(e){out.textContent="ERR "+e}},800);
</script></body></html>
